material share of cost. Option D postpones the very token estimates the product team needs before launch. Therefore, B is the complete projection method. Relevant Study Guide topics: token accounting, model pricing, prompt caching, cost forecasting, workload sizing, and production economics."}, {"id": 32, "q": "A Claude application is occasionally refusing to answer questions that should be in scope, including questions the application has answered correctly in the past. You want to investigate. What is the first step of your investigation?", "c": ["Test whether removing or adjusting those instructions resolves the behavior.", "Identify which questions have been refused and compare them against previously answered questions to determine what changed between the successful and refused interactions.", "Assess whether the refusals cluster around specific input patterns, question types, or time periods by analyzing the distribution of refused requests in the logs.", "Examine traces of the refused requests to identify what triggers the refusal, whether input patterns, system prompt content, or other context."], "a": 3, "e": "The supplied exam source marks B as correct. The first debugging action should be evidence collection rather than immediately modifying prompts or configuration. A trace exposes the complete conditions under which the refusal occurred: user input, system instructions, accumulated conversation state, tool results, parameters, and resulting model output. This is important because a refusal can originate from several interacting causes. A particular input pattern may trigger it; system instructions may unintentionally conflict with the requested task; prior conversational context may alter Claude's interpretation; or contextual information may make an otherwise acceptable request appear out of scope. Without examining the failing execution path, changing instructions is speculative. Option A jumps directly to remediation before identifying the cause. C provides useful aggregate analysis but is more appropriate after individual failing executions have been inspected. D is also valuable for comparative debugging, but determining what changed requires the detailed execution data that traces provide. The correct troubleshooting sequence is therefore: capture or inspect representative failed traces, determine the trigger, compare against successful interactions, formulate a hypothesis, make a targeted change, and re- evaluate."}, {"id": 33, "q": "You are extending a Claude agent with a capability that needs to be reusable across multiple teams in the organization, with each team able to invoke and use it independently. How would you build the capability?", "c": ["As a Skill or MCP server because both are purpose-built for cross-team reuse independently by each consuming team.", "As a wrapper around an existing built-in tool that adds the missing functionality, on the grounds that built-in tools cover the reuse pattern when extended carefully.", "As a shared library that each team imports into its own Claude application code, with each team responsible for keeping the library up to date in its integration.", "As a custom tool embedded in this team's agent only, with other teams able to copy the implementation into their own agents when they need the capability."], "a": 0, "e": "Option C is correct because Skills and MCP are first-class Claude extension mechanisms intended to make capabilities reusable rather than embedding one-off logic inside a single agent. Claude documentation describes Skills as reusable knowledge, instructions, and workflows that can be loaded when relevant. It describes MCP as the standard mechanism for connecting Claude to external services, tools, prompts, and resources. Claude Code plugins can package Skills and MCP servers for distribution across projects and teams. Option A tightly couples the capability to one team's agent and requires copying code, creating version drift and duplicated maintenance. Option B is technically reusable software, but it leaves every consuming Claude application responsible for its own integration and does not expose the capability through Claude's native extension interfaces. Option D assumes an existing built-in tool is the correct abstraction even though the scenario specifically requires an independently reusable capability. The precise choice between Skill and MCP depends on what is being reused: use a Skill for reusable instructions/workflows; use MCP when the capability exposes external data or actions. Therefore, C best reflects the Claude Developer extension model. Relevant topics: Agent Skills, MCP, plugins, tool integration, reuse, and cross-team capability distribution."}, {"id": 34, "q": "You are designing a Claude application that helps medical researchers analyze multi-step clinical case studies. The application must work through differential diagnoses by considering symptom patterns, weighing evidence across competing hypotheses, and showing intermediate reasoning steps before producing a final recommendation. The team is choosing among Claude's available model options. The model option best suited to this use case is...", "c": ["Fast mode, which prioritizes the lowest possible latency at the expense of reasoning depth on complex tasks.", "Zero-shot prompting alone with no model option adjustments, which keeps the application's configuration as simple as possible.", "Extended thinking, which lets the model reason through the differential diagnosis steps before producing the final recommendation.", "A smaller model with a tighter context window, which encourages the model to focus its limited capacity on the task."], "a": 2, "e": "Option B is the best answer because the task requires deliberate multi-step reasoning over competing hypotheses before a final recommendation. Anthropic's thinking documentation explains that enabling thinking gives Claude additional reasoning capacity before producing the final response, and larger thinking budgets can improve performance on complex analytical tasks. That maps directly to a differential-diagnosis workflow involving evidence comparison, hypothesis elimination, and multi-stage synthesis. Option A uses ordinary zero-shot prompting and does not specifically allocate additional reasoning capacity. Option C explicitly optimizes for minimum latency at the expense of reasoning depth, which conflicts with the complexity requirement. Option D reduces model and context capacity and therefore has no principled relationship to better differential reasoning. One current-platform nuance is important: manual \"extended thinking\" is the legacy configuration on supported Claude 4.5/4.6 models, while newer models use adaptive thinking. That does not change the question's underlying answer: among the listed choices, B is the only option that intentionally provides a reasoning phase for complex analysis. Relevant Study Guide topics: thinking, reasoning budgets, complex- task model configuration, latency-quality tradeoffs, and model selection."}, {"id": 35, "q": "Your Claude application uses structured output that is consumed by downstream code. The team wants to handle malformed or unexpected output gracefully so it does not crash downstream systems. The best choice for handling this issue would be to…", "c": ["Crash on any unexpected output and require manual recovery on affected requests the application handles during normal operation.", "Silently drop any output that does not match expectations so downstream systems do not see the malformed output the application receives from the model.", "Apply defensive parsing to handle unexpected fields, missing values, and type mismatches that the downstream code might otherwise crash on.", "Use the output the model produces and leave schema enforcement to a later phase of production after the application is more complete."], "a": 2, "e": "Option D applies a fundamental production engineering principle: treat externally generated data as potentially malformed and parse it defensively before use. Downstream application logic should not assume that every field exists, every type is correct, or every unexpected property can safely be ignored. Instead, the parser should validate expected structures, handle optional or missing values deliberately, reject incompatible types, and convert failures into controlled application errors rather than process crashes. Anthropic's Structured Outputs documentation identifies exactly these failure classes for unconstrained model output: malformed JSON, missing required fields, inconsistent types, and schema violations can break downstream applications. Current Structured Outputs and strict tool-use capabilities can eliminate many schema-level failures through constrained decoding, but defensive handling remains an important software boundary when unexpected data can still arise from external services, legacy paths, or semantic validation requirements. A creates unnecessary outages. B hides failures and discards potentially recoverable data without observability. C deliberately postpones a reliability requirement until after deployment . The supplied question identifies D as correct. Relevant topics: Claude App Design, defensive programming, structured output, schema validation, parsing, error handling, downstream reliability, and type safety."}, {"id": 36, "q": "Your Claude application is producing inconsistent outputs for similar inputs, even when using the same model and prompt. You want to debug the issue systematically. Your debugging approach would…", "c": ["Lower the model's temperature and re-run the inconsistent inputs to determine whether the parameter change reduces output variability across runs.", "Retry every request that produces an unexpected output and log the results to identify whether repeated calls converge on a consistent response pattern.", "Capture full traces of input, system prompt, user messages, model output, and parameters, then analyze the differences between consistent and inconsistent runs.", "Assume inconsistent outputs reflect normal LLM non-determinism and document the variability as an accepted characteristic of the application's behavior."], "a": 2, "e": "The examination source explicitly identifies D . Non-determinism is a normal LLM property, but that fact does not justify assuming every inconsistency is unavoidable. Systematic diagnosis begins by capturing the complete execution conditions for successful and unsuccessful runs. A useful trace should expose the actual user input, system prompt, prior messages or context, tools and tool results where applicable, model identifier, request parameters, output, stop reason, and relevant execution events. Current Anthropic agent infrastructure exposes session, span, and agent events specifically to provide observability into session state and execution progress. This makes comparison possible: the engineer can determine whether apparently \"same\" calls actually differ in accumulated context, tool state, model configuration, parameters, or external data. A changes a variable before establishing the cause and, on newer Claude releases, temperature may not even be configurable. B generates additional samples but does not ensure the underlying conditions are understood. C prematurely classifies unexplained behavior as acceptable nondeterminism. The correct sequence is observe, compare, form a hypothesis, reproduce, modify, and evaluate ."}, {"id": 37, "q": "The product team has described a new Claude feature in business terms: \"agents should help our analysts produce client memos faster.\" You need to convert this into actionable technical requirements for the engineering team. Your first step would be to…", "c": ["Ask the analysts about the current memo production process to see where they think Claude could be introduced as a prompt-driven drafting step.", "Assess what similar agent-based features have been built internally or in the industry and use those precedents to scope the technical approach.", "Interpret the functional and infrastructure requirements implied by the business goal.", "Examine what model capabilities and tier options are available and determine which best supports the memo drafting workflow described by the product team."], "a": 2, "e": "The supplied examination source identifies D as correct. The statement \"produce client memos faster\" is a business objective , not an implementable engineering requirement. The first engineering activity is therefore requirements decomposition: determine what functionality is required and what technical characteristics must support it. Functional requirements might specify how analysts provide source information, what stages the agent performs, whether it researches, outlines, drafts, revises, or cites material, which systems it accesses, what output it returns, and where human approval occurs. Infrastructure and non-functional requirements then define latency, access control, confidentiality, context size, availability, auditability, model selection, integration interfaces, token cost, observability, and operational constraints. Anthropic's developer lifecycle similarly separates defining measurable success criteria from choosing and implementing model capabilities. Its evaluation guidance emphasizes establishing specific, measurable success criteria before optimizing a model or prompt. Claude's agent configuration also separates implementation components such as the model, system prompt, tools, MCP servers, and Skills-choices that logically follow requirement definition. A is useful discovery but prematurely assumes a prompt-driven drafting implementation. B is precedent- driven rather than requirement-driven. C selects technology before defining what the system must accomplish. Relevant topics: Understanding Reqs, functional requirements, infrastructure requirements, non- functional requirements, acceptance criteria, and solution decomposition ."}, {"id": 38, "q": "Your Claude application makes high-volume API calls during business hours and very few calls overnight. The team is concerned about staying within rate limits during peak hours and wants to understand how the Claude API enforces those limits. How would you proceed?", "c": ["Examine the peak-hour request patterns in your application logs and smooth traffic by distributing requests more evenly across the business-hours window.", "Review the API documentation for streaming endpoints and evaluate whether migrating peak-hour calls to streaming reduces exposure to rate limit enforcement.", "Assess the average payload size of current API calls and consolidate requests where possible to reduce the total number of calls made during peak hours.", "Identify the rate limits, design the application to stay within them during peak hours, and use exponential backoff when limits are reached."], "a": 3, "e": "The supplied question marks C , and Anthropic's API documentation directly supports it. Claude API rate limits are enforced using dimensions such as requests per minute (RPM), input tokens per minute (ITPM), and output tokens per minute (OTPM) . Anthropic also notes that short traffic bursts can exceed effective limits even when a longer-term average appears acceptable. Applications should therefore determine the organization's actual configured limits, model peak traffic against those boundaries, throttle or queue work as necessary, and handle 429 responses correctly. Rate-limit responses include a retry-after value indicating when another request should be attempted. Anthropic's official SDKs automatically retry transient connection failures, rate-limit errors, and server errors with exponential backoff by default. Streaming does not exempt requests from rate limits, making A technically incorrect. Consolidating payloads in B may reduce request count but could increase token consumption and does not by itself address all rate- limit dimensions. D may smooth traffic, but it is only one optimization and does not substitute for rate-limit- aware application logic."}, {"id": 39, "q": "Your Claude application produces good responses for typical inputs but struggles with edge cases. You have several labeled examples of edge-case inputs and the desired response for each. You want to use these examples to improve the model's handling of edge cases. What is the best way to use these examples?", "c": ["Tell users to avoid submitting the edge-case inputs to the application by adding warnings in the application's user interface.", "Train a custom model on the edge-case examples and deploy that custom model in place of the team's current Claude integration.", "Embed the examples in a database for the model to find during inference.", "Add the labeled edge-case examples to the prompt as few-shot examples so the model can learn the pattern."], "a": 3, "e": "Option B applies few-shot, or multishot, prompting, one of Anthropic's recommended techniques for steering Claude when examples of desired behavior are available. Labeled input/output pairs give Claude concrete demonstrations of how it should respond, which is particularly valuable when edge cases are difficult to express completely through abstract rules. Anthropic states that examples are among the most reliable mechanisms for steering output format, tone, and structure. Its prompting guidance recommends relevant, diverse examples that cover edge cases while avoiding accidental patterns. For best results, examples should be clearly separated from the main instructions, such as by using <example> and <examples> tags. A retrieval database could be useful if a very large or dynamically selected example collection were required, but that adds unnecessary complexity for the small labeled set described. C is disproportionate: a few examples do not justify replacing the application's Claude integration with custom model training. D avoids rather than solves the identified failure mode. Therefore, B directly uses the available supervision at inference time and allows rapid iteration through evaluation. Relevant Claude Developer topics are prompt construction, fewshot prompting, edge-case handling, example selection, evaluation-driven iteration, and behavioral steering."}, {"id": 40, "q": "Your Claude application validates structured output but has been treating validation failures as terminal errors. Each validation failure causes the entire user request to fail. The team wants to handle validation failures more gracefully. How would you handle the validation failures?", "c": ["Tell users that validation failures are unavoidable and instruct them to perform manual accuracy checks before relying on outputs.", "Disable output validation until the underlying cause of validation failures has been identified and addressed in a future release.", "Treat validation failures as a recognized error path that triggers retry, repair, or fallback logic before failing the user request.", "Pass validation failures directly to downstream systems and let each downstream system decide how to handle the malformed output."], "a": 2, "e": "C converts validation failure from an uncontrolled terminal condition into a first-class recoverable error path . The supplied exam item identifies C as correct. If structured output does not meet the application's contract, it should never be forwarded as though valid, but immediate user-visible failure is also unnecessary when bounded recovery is possible. A robust flow can retry generation, ask Claude to repair the malformed structure using the validation error as feedback, switch to an approved fallback path, or ultimately return a controlled failure if the retry budget is exhausted. The application must cap these recovery attempts to avoid unbounded loops. Anthropic's Structured Outputs documentation explains that unconstrained model generation can produce parsing errors, missing fields, inconsistent types, or schema violations that otherwise require error handling and retries. Current Structured Outputs can eliminate many schema-level failures through constrained decoding, although exceptional conditions such as refusal or output truncation still require explicit handling. A violates the validation boundary. B removes a protective control. D transfers an engineering reliability responsibility to end users."}, {"id": 41, "q": "Your Claude application is hitting context window limits when processing long customer service transcripts. A junior developer suggests increasing the temperature parameter to fix the issue. How would you respond?", "c": ["Explain that temperature controls sampling randomness and is unrelated to context capacity, then address the context issue through summarization or chunking.", "Increase the temperature parameter as the junior developer suggested and observe whether the context window issue resolves over the next several runs of the application in production.", "Remove the system prompt entirely to make room for longer transcripts in each request, freeing up context window space the system prompt would otherwise consume.", "Adjust the temperature parameter together with the max_tokens parameter, treating the combined adjustment as the team's mechanism for managing context window pressure during long-transcript processing."], "a": 0, "e": "Option D correctly separates sampling configuration from context management. Temperature historically controlled the randomness of token selection; it did not increase the number of tokens Claude could accept within a request. Anthropic's current Messages API documentation continues to describe temperature in terms of randomness and, for newer model generations, marks manual temperature control as deprecated. Therefore, changing temperature cannot solve a context-capacity problem. Long transcripts instead require context-engineering techniques. Appropriate approaches include chunking documents, summarizing earlier material, retrieving only relevant sections, or using context editing /compaction so high-value information remains visible while unnecessary material is removed. Anthropic's context-editing guidance explicitly supports summarization and replacement of growing conversation history to keep long-running workloads within usable context limits. B incorrectly conflates generation parameters with context capacity. C may save some tokens but removes persistent application instructions and is therefore architecturally unsound. D modifies an unrelated parameter without addressing the root cause. Relevant Study Guide topics: context windows, token budgets, sampling parameters, summarization, chunking, and context engineering."}, {"id": 42, "q": "You are explaining to a stakeholder why running the same Claude prompt twice can produce slightly different results. The stakeholder is concerned this means the application is broken. How would you address the stakeholder's concern?", "c": ["Explain that LLMs are non-deterministic by default due to sampling, and describe how the application handles this through validation, retries, or temperature adjustment.", "Tell the stakeholder the variation is caused by Claude being updated continuously by Anthropic, and that switching to a fixed model snapshot will eliminate the variation entirely.", "Tell the stakeholder the variation comes from network latency and that switching to a faster network connection will produce more consistent results across runs.", "Tell the stakeholder the variation is a bug that the team will fix in the next release of the application, then create a work ticket to fix the bug."], "a": 0, "e": "Option C correctly explains a fundamental property of generative language models. The supplied examination material identifies C as the correct answer. Claude generates subsequent tokens probabilistically rather than retrieving a single fixed answer for each prompt. Consequently, identical or highly similar requests can produce variations in wording, ordering, explanation depth, and sometimes substantive details. Anthropic's API documentation explicitly states that sampling parameters control randomness and, importantly, that even configurations historically using a temperature of 0.0 were not fully deterministic . Current newer Claude models increasingly manage sampling behavior internally, so application design should not assume byte-for-byte identical responses across executions. Production systems therefore handle variation through architecture: schema validation for machine-consumed output, deterministic business-rule checks, retries where appropriate, evaluations for acceptable behavioral ranges, and application-level safeguards. Temperature adjustment may reduce variation on models that support the parameter, but it does not fundamentally convert an LLM into a deterministic function. A incorrectly labels normal model behavior as a defect. B confuses network latency with generation variability. D overstates model snapshot behavior; pinning a model prevents silent model-version changes but does not eliminate sampling variability. Relevant topics: sampling, nondeterminism, validation, retries, model versions, and robust Claude API integration ."}, {"id": 43, "q": "The Anthropic API deprecated a request parameter that your Claude application uses in approximately 40 places across the codebase. The deprecation notice gives a six-month window before the parameter is removed and recommends a replacement parameter with slightly different semantics. You would respond to the deprecation by...", "c": ["Swapping all 40 call sites in a single change right away to prevent drawn-out migration work that will delay ongoing functioning.", "Adding regression tests to cover the parameter's behavior, then migrating call sites in batches that you validate against regression tests.", "Keeping the deprecated parameter in place while writing a wrapper function around it to insulate the rest of the codebase from the eventual change.", "Migrating all 40 call sites in a single change near the removal date to ensure the deprecated parameter continues to work as long as possible."], "a": 1, "e": "The supplied examination source selects C . Because the replacement parameter has different semantics , this is not a mechanical rename. The application must establish what existing behavior is important, encode that behavior in regression tests, and migrate incrementally so deviations can be detected and isolated. Anthropic's deprecation guidance follows the same lifecycle principle. Deprecated components remain temporarily available but receive a retirement deadline and a recommended replacement. Anthropic advises migrating before retirement and thoroughly testing applications against replacements well in advance of the cutoff. Its API versioning documentation also emphasizes compatibility contracts while acknowledging that APIs evolve and deprecated versions eventually become unavailable. Batch migration reduces blast radius. If one migrated group fails regression tests, the team can diagnose the semantic difference before changing remaining call sites. It also avoids concentrating all migration risk near the retirement deadline. A delays risk until the worst possible time. B only hides the dependency and does not complete migration. D changes all 40 usages simultaneously, making regression diagnosis and rollback substantially harder."}, {"id": 44, "q": "You are building an agent that needs to call several internal APIs and a database in a structured, repeatable way. Your team has decided to use the Claude Agent SDK rather than build a custom loop. You are setting up the agent's tool definitions and execution loop. How would you set up the tools and execution loop?", "c": ["Use the SDK's tool interface and write the loop and history layer in the team's own code.", "Use the SDK's tool interface and let the SDK handle the loop, dispatch, and history.", "Use the SDK's tool interface and loop, with conversation history stored in a separate team database.", "Call the Messages API directly and let the model format its tool calls in plain text."], "a": 2, "e": "The supplied Claude Developer examination source selects A . The purpose of choosing an agent SDK rather than implementing a custom Messages API loop is to consume the SDK's higher-level abstractions. Re- implementing dispatch, iteration, and state handling would discard much of the value provided by the SDK. Anthropic's current documentation distinguishes low-level tool-use loops from higher-level SDK-managed abstractions. With a manually implemented Messages API workflow, application code must inspect stop_reason, execute requested client tools, append tool_result blocks, preserve conversation history, and repeat until Claude completes the turn. Anthropic's higher-level tooling can instead encapsulate this repetitive control flow. Current migration guidance also confirms that Agent SDK @tool functions are automatically dispatched by the SDK and that agents, tools, and sessions are first-class SDK concepts. B is incorrect because structured tool use should not be replaced with informal plain-text calls. C introduces an unnecessary custom state dependency when no external persistence requirement exists. D duplicates control-loop functionality despite the explicit decision to use the SDK."}, {"id": 45, "q": "You have just shipped a new Claude-powered application to production. The development phase is complete, and the system is now in active use by internal teams. The next phase of work for this system is…", "c": ["Operating and maintaining the system, including monitoring, responding to issues, and planning evolution.", "Handing the system over to a separate operations team that will manage it independently of the development team going forward.", "Retiring the system, since shipping is the final lifecycle stage for any application that reaches production.", "Running a formal post-deployment review that assesses the development phase before the team does any further work on the system."], "a": 0, "e": "Production deployment does not terminate the software lifecycle. Once a Claude application is actively serving users, it enters an operations and maintenance phase in which developers and operators monitor performance, evaluate model behavior, respond to failures, control costs, manage security, and evolve the implementation as requirements or model capabilities change. Anthropic's official developer documentation explicitly separates the journey into build, evaluate-and-ship, and operate stages. The operating stage includes workspace administration, API-key management, usage monitoring, and model migration. This confirms that production deployment is a transition into ongoing operation rather than the endpoint of development. For LLM applications, maintenance is especially important because production traffic can expose input distributions and failure modes that were not fully represented during prerelease evaluation. Operational data should feed back into evaluations, prompt improvements, guardrails, architecture decisions, and model- version planning. A incorrectly treats deployment as final. B may be useful but is only one governance activity, not the overall lifecycle phase. D assumes a mandatory organizational separation that is neither required nor generally desirable. The supplied exam source marks C. Relevant topics: Systems Life Cycle, production operations, monitoring, maintenance, incident response, evaluation, and continuous system evolution."}, {"id": 46, "q": "You are designing an agent that processes vendor invoices. The work involves a small number of well- understood steps, but occasionally an invoice arrives in an unexpected format that requires the system to decide between rerouting, requesting clarification, or flagging for human review. The most appropriate architecture for this system is...", "c": ["A fully autonomous agent that handles every invoice from start to finish across all formats.", "A workflow for the standard path with an agent invoked at the decision point for unexpected formats.", "A manager agent that delegates each step of standard invoice processing to a dedicated subagent, with a separate subagent handling each unexpected format.", "A single large prompt that processes every incoming invoice, both standard and unexpected, in one model call."], "a": 1, "e": "Option D applies the correct hybrid pattern. Anthropic distinguishes workflows-where LLMs and tools execute along predefined code paths-from agents, where the model dynamically determines how to proceed. Anthropic recommends choosing the simplest architecture that meets the requirement: workflows provide predictability and consistency for well-understood tasks, while agents are valuable where flexible model- driven decisions are necessary. Standard invoice processing is explicitly described as a small number of known steps. That makes a deterministic workflow the appropriate default because the path can be tested, monitored, and reproduced. The unexpected-format branch is different: the system must reason among rerouting, requesting clarification, or human escalation. That decision point is where agentic flexibility adds value. A makes the entire process autonomous even though most steps do not require autonomy, increasing cost, latency, and unpredictability. B introduces multiple specialized agents despite no demonstrated need for that complexity. C collapses deterministic processing and exception handling into one monolithic model call, making validation and debugging harder. Therefore, D combines workflow predictability with targeted agentic reasoning. Relevant Study Guide topics: workflows versus agents, routing, exception handling, hybrid agentic architecture, escalation, and complexity minimization."}, {"id": 47, "q": "A new Claude model release includes performance improvements for several reasoning tasks but has changed the format of its responses to system prompts that use multi-section instructions. Your application uses multi- section system prompts heavily. Initial evaluation on the application's actual workload shows the new model performs 8 percent better on reasoning tasks but produces malformed output on roughly 3 percent of requests because of the format change. The team is debating whether to upgrade. How would you decide?", "c": ["Upgrade and add a downstream validation step that catches the 3 percent malformed output before it reaches users, treating the validation step as the team's mitigation for the format change.", "Upgrade immediately, because the 8 percent reasoning improvement outweighs the 3 percent malformed output rate across the application's typical request distribution.", "Stay on the previous model permanently to avoid the malformed output rate and any future format changes that subsequent model releases might introduce in the application.", "Adapt the application's system prompt to the new model's format expectations and reevaluate, then upgrade only if the adapted prompt eliminates the malformed output while preserving the reasoning improvements."], "a": 3, "e": "The supplied examination page marks B . The scenario already demonstrates why model upgrades must be treated as evaluated software changes rather than automatic replacements: the new model improves one metric while introducing a regression in another. Anthropic's official model-selection guidance recommends creating benchmark tests specific to the application's use case, testing models with the application's actual prompts and data, comparing response quality and edge-case performance, and weighing performance against operational tradeoffs. Therefore, the correct action is to adapt the multi-section system prompt to the new model's behavior and repeat the evaluation. Only after the formatting regression is eliminated-or reduced below an explicitly acceptable threshold-should the upgrade proceed. A incorrectly assumes that an 8% reasoning improvement numerically compensates for a 3% malformed- output rate; these metrics measure different consequences and cannot simply be subtracted. C treats the known incompatibility only downstream instead of first correcting the prompt/model interaction. D permanently rejects future improvement and is inconsistent with controlled lifecycle evolution. The engineering principle is migration through regression testing and adaptation , not blind upgrading or permanent version avoidance."}, {"id": 48, "q": "You are designing a multi-step Claude workflow where some steps must reason without seeing the full prior conversation history. The team wants to keep specific context isolated to specific steps. The context engineering technique you would use is…", "c": ["Embedding the full prior history in each step regardless of whether the step needs the prior history for its reasoning.", "Augmenting the context with all available content at every step so each step has access to the entire prior history of the workflow during its reasoning.", "Using a single global prompt that applies to every step in the workflow no matter what each step is reasoning about during its run.", "Context isolation through subagents or multi-step agentic workflows that scope each step's context to only what the step needs."], "a": 3, "e": "Option C is the correct application of context isolation. A specialized step should receive the minimum relevant information required for its own task rather than inheriting an ever-growing global transcript. This improves signal-to-noise ratio, limits accidental cross-task influence, controls token usage, and makes individual components easier to evaluate. Anthropic's context-engineering guidance explicitly identifies multi-agent architectures as a technique for long-horizon work. Specialized subagents can operate with their own context windows and return condensed results to an orchestrating agent rather than exposing every agent to every intermediate detail. This architecture protects each reasoning process from irrelevant history while allowing the overall system to preserve necessary state. Options A and D represent the opposite approach: indiscriminately loading the full prior history. Larger context is not automatically better; Anthropic warns that excessive context can introduce context pollution and degrade retrieval or attention to important information. B also fails because a single global prompt does not isolate state or tailor the information available to each processing stage. Therefore, C best implements scoped reasoning boundaries. Relevant Claude Developer topics are multi-agent architecture, subagents, context isolation, context engineering, orchestration, and long-running workflow design."}, {"id": 49, "q": "You are running Claude Code as part of an automated continuous integration pipeline. The pipeline needs Claude Code to execute a set of well-defined tasks without prompting for confirmation, and the output needs to be captured for downstream processing. How would you configure the pipeline?", "c": ["Disable Claude Code's confirmation prompts globally across all environments so the pipeline runs without interruption from any prompt.", "Run Claude Code in headless mode with the required permissions configured in settings.json and capture its output for downstream processing.", "Replace Claude Code with a different tool that does not require any configuration to operate without confirmation prompts in the pipeline.", "Run Claude Code in interactive mode and have a developer manually approve every confirmation prompt while the pipeline executes its tasks."], "a": 1, "e": "Option B is the correct automation pattern. A CI pipeline must operate non-interactively, so Claude Code should be invoked in its programmatic/headless execution mode and given only the permissions required for the predefined workflow. Output can then be captured by the pipeline and supplied to subsequent build, testing, reporting, or deployment stages. Claude Code's configuration system supports explicit permission rules in JSON settings. Anthropic documents that settings.json controls, among other behavior, what Claude Code can execute without asking. For example, permissions.allow can authorize specific commands while permissions.deny prevents sensitive operations. Project-level .claude/settings.json can be version-controlled so CI behavior is reproducible across runners. This is substantially safer than C, which disables confirmation behavior globally and expands the blast radius beyond the CI workload. D defeats automation because a human must remain present. A is unnecessary because Claude Code is explicitly configurable for automation scenarios. The principle is least-privilege non-interactive configuration: authorize only the commands and resources required by the pipeline and capture machine-readable output for downstream processing. Relevant Claude Developer topics are Claude Code automation, configuration management, permissions, CI/CD integration, headless execution, and reproducible project settings."}, {"id": 50, "q": "A teammate has asked how the Claude SDK handles transient API errors, such as a temporary network issue or a brief rate-limit response. They want to know whether the application code needs to handle every transient error or whether the SDK provides any default behavior. How would you describe the SDK's default behavior?", "c": ["The SDK provides default retry behavior for many transient errors, and the application code can configure or extend that behavior as needed.", "The SDK provides default retry behavior for transient errors up to a fixed number of attempts, and this behavior is not configurable.", "The SDK logs transient errors to a default error stream and continues execution without retrying, leaving the application code responsible for detecting and responding to failed calls.", "The SDK provides default retry behavior for network errors but surfaces rate-limit responses directly to the application code, which must implement its own retry logic for those cases."], "a": 0, "e": "Option D precisely matches Anthropic's SDK behavior. Official SDK documentation states that transient conditions are automatically retried two times by default with exponential backoff. The default retry set includes connection failures, HTTP 408 Request Timeout, 409 Conflict, 429 Rate Limit, and 5xx server errors. Developers can alter or disable this behavior through the SDK's retry configuration. This directly eliminates A because the retry count is configurable. B is incorrect because ratelimit responses are among the conditions automatically retried by the supported SDKs; the API also provides retry-after information where applicable. C is incorrect because the SDK does not merely log these failures and continue without attempting recovery. Application-level handling is still necessary after the configured retry policy is exhausted. Production code should distinguish permanent errors from transient failures, preserve request IDs for diagnostics, and decide whether higher-level fallback, queuing, or user-visible failure handling is appropriate. Therefore, D correctly characterizes the SDK abstraction: useful retry defaults combined with developer control. Relevant Study Guide topics: Claude SDKs, transient errors, HTTP 429, retries, exponential backoff, configuration, and resilient API integration."}, {"id": 51, "q": "You are deciding between deploying a Claude-powered agent on Anthropic's hosted infrastructure or self- hosting under a \"bring your own cloud\" model in your own AWS account. The agent processes customer data subject to your enterprise's data residency policies, but the team wants to ship quickly and avoid managing infrastructure. Which deployment model would you recommend?", "c": ["Deploying on Anthropic-hosted infrastructure to meet the team's shipping timeline, and flagging the data residency requirement for a follow-up compliance review after launch.", "Self-hosting under BYOC to satisfy the data residency requirement, while working with the infrastructure team to reduce the operational overhead of managing the deployment.", "Self-hosting under BYOC for an initial pilot, then evaluating whether to migrate to Anthropic-hosted infrastructure once the agent's data-handling patterns are better understood.", "Deploying on Anthropic-hosted infrastructure while the team drafts a request to update the enterprise data residency policy to accommodate hosted AI deployments."], "a": 1, "e": "Option C follows the governing constraint in the scenario: data residency is an enterprise requirement, whereas minimizing infrastructure management is a preference. A deployment architecture cannot knowingly violate a mandatory compliance boundary merely to accelerate delivery. The question should therefore be interpreted under its stated assumption that the described BYOC environment satisfies the enterprise residency policy. Anthropic's current Managed Agents documentation distinguishes Anthropic-managed cloud environments from self-hosted sandboxes running on infrastructure controlled by the customer. Self-hosting keeps tool execution, files, and network egress within customer infrastructure, although Anthropic documents that model- facing tool inputs and outputs can still pass through its control plane; therefore, actual regulatory approval must be based on the organization's precise data-flow requirements. B and D explicitly defer or violate the existing policy. A unnecessarily introduces a planned migration away from the residency-compliant architecture without establishing that such a migration would be permissible. Accordingly, C is the intended certification answer. Relevant Study Guide topics: deployment topology, data residency, self-hosting, compliance constraints, infrastructure ownership, security boundaries, and architecture tradeoffs."}, {"id": 52, "q": "Your Claude application is hitting context window limits when processing long customer service transcripts. A junior developer suggests increasing the temperature parameter to fix the issue. How would you respond?", "c": ["Increase the temperature parameter as the junior developer suggested and observe whether the context window issue resolves over the next several runs of the application in production.", "Explain that temperature controls sampling randomness and is unrelated to context capacity, then address the context issue through summarization or chunking.", "Adjust the temperature parameter together with the max_tokens parameter, treating the combined adjustment as the team's mechanism for managing context window pressure during long-transcript processing.", "Remove the system prompt entirely to make room for longer transcripts in each request, freeing up context window space the system prompt would otherwise consume."], "a": 1, "e": "Option A correctly separates sampling configuration from context management. Temperature historically controlled the randomness of token selection; it did not increase the number of tokens Claude could accept within a request. Anthropic's current Messages API documentation continues to describe temperature in terms of randomness and, for newer model generations, marks manual temperature control as deprecated. Therefore, changing temperature cannot solve a context-capacity problem. Long transcripts instead require context-engineering techniques. Appropriate approaches include chunking documents, summarizing earlier material, retrieving only relevant sections, or using context editing /compaction so high-value information remains visible while unnecessary material is removed. Anthropic's context-editing guidance explicitly supports summarization and replacement of growing conversation history to keep long-running workloads within usable context limits. B incorrectly conflates generation parameters with context capacity. C may save some tokens but removes persistent application instructions and is therefore architecturally unsound. D modifies an unrelated parameter without addressing the root cause. Relevant Study Guide topics: context windows, token budgets, sampling parameters, summarization, chunking, and context engineering."}, {"id": 53, "q": "Your Claude agent has too many tools, and many of them have overlapping functionality. The agent often picks an inappropriate tool when several could plausibly handle a request. How would you address the tool selection problem?", "c": ["Remove all tools and rely on the agent's general capability instead, with the application losing the workflows that previously relied on tools.", "Add more tools to cover every variation of the requests the agent handles, on the grounds that more tools give the agent more accurate options to choose from.", "Restructure the tool set by consolidating overlapping tools, removing unused tools, and clarifying tool descriptions so each tool has a distinct purpose.", "Add detailed examples to each tool's description so the agent can match incoming requests to the right tool by example, treating the examples as the team's selection mechanism."], "a": 2, "e": "Option D addresses the architectural cause of the failure: an ambiguous tool surface. Claude chooses tools partly from their names, descriptions, schemas, and the relationship between the request and the capability described. If multiple tools appear to perform substantially the same task, selection becomes unnecessarily difficult. Anthropic's tool-definition guidance explicitly recommends consolidating related operations into fewer tools and making descriptions clear about both what a tool does and when it should be used. The documentation notes that fewer, more capable tools reduce selection ambiguity and make the available tool surface easier for Claude to navigate. Option A makes the ambiguity worse by expanding an already overlapping tool set. B destroys required application capabilities. C could improve selection somewhat, because examples can clarify complex inputs, but it leaves the underlying duplication intact. Examples complement good tool design; they are not a substitute for distinct tool responsibilities. Therefore, D is the strongest solution: remove unused tools, merge functions that represent the same conceptual operation, and write discriminative descriptions defining appropriate and inappropriate usage. Relevant Study Guide topics: tool design, tool selection, descriptions, tool consolidation, agent construction, and reducing ambiguity."}, {"id": 54, "q": "Your Claude application uses tool calling to fetch patient data and generate summary reports. The flow occasionally fails because the model returns a tool_use block that references arguments not present in the schema, and your application code does not handle this case gracefully. How would you address this?", "c": ["Retry the same request repeatedly until the model returns a valid tool_use block that matches the schema as expected.", "Validate the tool_use block's arguments against the tool schema before dispatching the tool and handle invalid arguments as a recognized error path.", "Stop using tool calling entirely and replace tools with prompted text generation that asks the model to describe what it would do.", "Log invalid tool_use blocks when they occur and allow the tool dispatch to proceed, relying on the tool's own error handling to surface failures back to the application."], "a": 1, "e": "The question presents a trust-boundary failure: model-generated tool arguments are being accepted without sufficient validation before an external operation executes. A tool call should therefore be treated like input arriving at any typed application interface-the application must ensure that the tool name and arguments satisfy the declared contract before dispatch. Anthropic describes tool use as a contract in which the application defines the tool's schema and Claude returns structured tool_use input. Current Claude functionality also supports strict: true, which guarantees schema-compliant tool inputs through constrained generation and specifically addresses invented parameters, incompatible types, and missing required fields. For applications not using strict tool use, explicit application- side validation and a controlled error path remain essential. B knowingly executes invalid input. C relies on uncontrolled repetition rather than deterministic validation and bounded recovery. D eliminates a useful capability instead of correcting its execution boundary. Therefore, A provides the correct defensive design. Relevant Study Guide topics: tool calling, tool_use, input_schema, strict tool use, schema validation, defensive execution, error handling, and secure tool dispatch."}, {"id": 55, "q": "You are choosing a Claude model for a high-volume classification task. Each classification is straightforward, latency requirements are tight, and per-request cost matters at scale. Which model would you choose?", "c": ["A mid-tier Claude model selected by default, because mid-tier models balance quality and cost in a way the team can apply across most tasks.", "The largest, highest-capability Claude model, to maximize quality on every classification the application produces during normal operation across all requests.", "Multiple Claude models in series, where each request runs through more than one model and the application combines the outputs into a final classification.", "A smaller, faster Claude model, because the task is straightforward and the workload prioritizes latency and per-request cost at scale."], "a": 3, "e": "Option C matches Anthropic's efficiency-first model-selection guidance. For a straightforward, high-volume workload where latency and unit cost are explicit constraints, the correct starting point is a faster, economical model that can meet the task's quality threshold. Anthropic specifically lists high-volume straightforward tasks, tight latency requirements, and costsensitive implementations as cases where an efficiency-first model choice is appropriate. The crucial qualification is that \"smaller\" does not mean accepting inadequate quality. The team should evaluate the candidate against representative classification examples and defined accuracy criteria. If it passes, moving to a larger model adds cost and often latency without delivering required business value. A selects a mid-tier model by convention rather than workload evidence. B multiplies inference calls, generally increasing both latency and cost for a simple classification problem. D optimizes maximum capability even though the task does not require frontier-level reasoning. Therefore, C is the appropriate initial model choice, followed by workload-specific validation. Relevant Study Guide topics: Claude model selection, efficiency-first design, classification workloads, throughput, latency, per-request economics, evaluation, and quality/cost tradeoffs."}, {"id": 56, "q": "A Claude application is producing outputs that drift away from the expected JSON format after several conversation turns. The first few turns produce correctly formatted output, but later turns gradually lose structure. How would you address the drift?", "c": ["Identify the failure mode as format drift, examine how the conversation context evolves over turns, and address the drift through context management or output validation.", "Restart the application after every turn and monitor whether the format remains consistent across subsequent interactions.", "Switch to a smaller Claude model and re-test the application to determine whether the drift persists across conversation turns.", "Truncate every response to the first few characters, validate that the truncated output matches the expected JSON structure, and log any mismatches for review."], "a": 0, "e": "Option A correctly treats this as a context-dependent format drift problem rather than an arbitrary model failure. Because the application initially produces valid JSON and progressively loses structure over subsequent turns, the investigation should focus on how accumulated conversation history changes the instructions and examples visible to Claude. Earlier malformed outputs, conflicting instructions, tool results, or unnecessary historical content can gradually reduce adherence to the intended format. The application should therefore inspect the conversation state, preserve the authoritative formatting requirement, prune irrelevant content where appropriate, and validate outputs at the application boundary. Anthropic's Structured Outputs capability is specifically designed to prevent malformed structured responses by constraining Claude to a supplied JSON Schema. Official guidance states that Structured Outputs provide valid, parseable, schema-compliant results for downstream processing. B destroys the response rather than correcting the failure mode. C resets state but prevents meaningful multi- turn operation and does not diagnose why context causes drift. D changes model characteristics without establishing that the model is responsible. The supplied question on page 12 identifies A as correct. Relevant topics: Agent Architecture, context engineering, format drift, structured outputs, context evolution, schema validation, and long-running conversations."}, {"id": 57, "q": "You are setting up Claude Code for a new project repository. Your team has shared coding standards, preferred libraries, and project-specific context that every developer working on the repository should have available when they use Claude Code. How would you set this up?", "c": ["Configure Claude Code through environment variables that each developer sets on their own machine when they begin working in the repository.", "Document the standards in a separate wiki page maintained outside the repository so the documentation stays decoupled from the source code.", "Initialize Claude Code in the repository and document the standards and project-specific context in a CLAUDE.md file at the repository root.", "Add the coding standards and project context to the repository's existing README file and direct developers to reference it when starting Claude Code sessions."], "a": 2, "e": "Option C is correct. Claude Code uses CLAUDE.md as the standard mechanism for supplying persistent project-level instructions and context. Anthropic's Claude Code documentation states that project instructions can be stored in ./CLAUDE.md or ./.claude/CLAUDE.md and shared with team members through source control. Appropriate content includes coding standards, architectural decisions, project conventions, build/test commands, preferred workflows, and information developers would otherwise need to repeat to Claude during every session. The /init command can also generate an initial CLAUDE.md based on the repository. A wiki may be valuable for human documentation, but Claude Code does not automatically receive that material as project context. B creates developer-specific configuration and risks inconsistency across the team. D places the information in a human-facing README but does not use Claude Code's purpose-built persistent instruction mechanism. Therefore, C gives the repository a shared, version-controlled source of Claude-specific project guidance. Relevant Study Guide topics: CLAUDE.md, project configuration, persistent instructions, repository context, team standards, and configuration management."}, {"id": 58, "q": "The team is debating whether to build a new capability as a custom tool or to use an existing built-in tool that nearly covers the use case but lacks one specific feature. How would you decide?", "c": ["Examine the custom tool option by scoping the implementation effort and determining whether the additional flexibility justifies the development and maintenance cost.", "Identify whether the team has previously built similar custom tools and use those precedents to determine which approach is more consistent with the existing codebase.", "Review the built-in tool's documentation and assess whether its existing capabilities are sufficient to cover the use case without any modification or extension.", "Evaluate whether the missing feature can be addressed by extending the built-in tool or warrants a custom tool, then choose accordingly."], "a": 3, "e": "The supplied Claude Certified Developer Foundations material identifies A as the best answer. The decision should begin with the actual capability gap rather than a predetermined preference for built-in or custom tooling. If the existing capability can satisfy the requirement with a small supported extension or composition, using it avoids unnecessary implementation and maintenance. If the missing capability is fundamental, a custom tool becomes justified. Anthropic's tool architecture explicitly supports both categories. Claude provides Anthropicmanaged or predefined tools while also allowing developers to define custom tools for operations specific to their application. With a custom client tool, the application defines the contract and executes the operation before returning its result to Claude. A is more complete than C because it evaluates both sides of the boundary : whether the existing mechanism can realistically meet the missing requirement and, if not, whether custom implementation is warranted. B prioritizes precedent over current requirements. D only determines whether the unmodified built-in tool is sufficient and does not address what to do when it is almost-but not entirely-sufficient."}, {"id": 59, "q": "A teammate has asked you to explain why the team's Claude application is billed for output tokens at a different rate than input tokens. They had assumed the rate was the same for both. How would you explain the difference?", "c": ["Output tokens are not billed at all, because cost is determined entirely by the input tokens sent to the model on each request.", "Output tokens are typically billed at a lower rate than input tokens, because output tokens are cheaper to produce than input tokens are to process.", "Output tokens are typically billed at the same rate as input tokens, and the apparent rate difference is a billing error to report to Anthropic.", "Output tokens are typically billed at a higher rate than input tokens, and cost models for the application should reflect both rates separately."], "a": 3, "e": "The supplied Claude Certified Developer Foundations question identifies D as the correct answer. Anthropic prices input and output tokens separately, so application cost models must independently account for the number of tokens supplied to Claude and the number generated in response. Anthropic's official pricing documentation confirms that output-token pricing is normally higher than base input-token pricing. For example, current Claude models maintain distinct columns for base input tokens and output tokens; the exact dollar amounts depend on the selected model. This distinction matters because an application with relatively small prompts but very large generated responses can incur substantial output- token expenditure even when input volume is modest. Therefore, cost forecasting should use approximately: input tokens × input rate + output tokens × output rate , with additional adjustments where prompt caching, batch processing, server tools, or other pricing modifiers apply. Option A incorrectly assumes equivalent rates, B reverses the normal relationship, and C incorrectly excludes generated tokens from billing."}, {"id": 60, "q": "You are setting up a CI/CD pipeline for a new Claude application. The pipeline needs to run automated checks on every pull request before code can be merged. The CI/CD checks would include…", "c": ["A full end-to-end production deployment on every pull request to catch all possible issues before any code is merged into the main branch.", "Automated linting and security scanning, with Claude integration testing handled manually during pre- release verification by a designated reviewer.", "Automated tests of the Claude integration, linting, and any other standard quality gates the team applies to its other services.", "Automated tests of the Claude integration only, with linting handled separately during local development on each developer's machine."], "a": 2, "e": "Option A treats a Claude application as production software subject to the same disciplined engineering controls as other services while adding tests for its model integration. CI should provide repeatable feedback before merge, including deterministic unit/integration tests, linting, type or static checks where applicable, security checks, and organization-specific quality gates. Claude-specific behavior should also be tested systematically rather than reserved for manual release verification. Anthropic's evaluation guidance recommends task-specific test cases reflecting realistic inputs and edge cases, measurable success criteria, and automation whenever practical. Claude Code documentation also explicitly identifies CI automation, including GitHub Actions and GitLab CI/CD, as supported development workflows. B is excessive because every pull request should not directly deploy to production merely to obtain end-to-end coverage; testing environments and staged deployment exist for that purpose. C makes linting dependent on individual developer discipline rather than a shared merge gate. D delays Claude integration verification until pre-release and makes a repeatable automated check manual. Therefore, A provides comprehensive and consistent pull-request validation. Relevant Study Guide topics: CI /CD, automated testing, integration testing, linting, evaluations, regression prevention, and quality gates."}, {"id": 61, "q": "You are setting up a Claude application that will run a mix of multi-turn conversations and one-off requests. You want to use caching techniques to reduce token costs where they apply. A teammate suggests caching the model's output as well, so the application does not have to make duplicate Claude calls when similar queries arrive. You would apply prompt caching to...", "c": ["Nothing, because prompt caching does not affect cost in any application that mixes multiturn conversations and one-off requests in a single deployment.", "The static portions of prompts that are repeated across requests, such as system prompts, instructions, or shared context.", "Only the user's input portion of each request because user input is the part of the prompt that varies the most across the application's normal operation.", "The model's output, treating the response from each request as cacheable content the application can return on similar future queries."], "a": 1, "e": "The supplied exam source marks D . Claude prompt caching is designed for repeated prompt prefixes, not semantic caching of generated answers. High-value cache candidates include stable system prompts, long instructions, tool definitions, shared background documents, repeated examples, and the previously accumulated prefix of a multi-turn conversation. Anthropic explains that prompt caching reuses a matching prompt prefix and can substantially reduce processing time and input-token cost on subsequent requests. The cache operates across the request structure- tools, system content, and messages up to the relevant cache boundary. It is particularly useful for prompts with many examples, large repeated context, repetitive instructions, and long multi-turn conversations. B describes response caching , which is a separate application-level technique and is not what Anthropic's prompt caching feature does. C targets the portion that usually changes most, making it a poor general cache boundary. A is incorrect because multi-turn workloads are a major prompt-caching use case. Therefore, maximize reusable stable prefixes and place changing request-specific content after them where practical."}, {"id": 62, "q": "Your enterprise has a contract with AWS that requires Claude API calls to flow through Amazon Bedrock rather than the direct Anthropic API. Your team is building a new Claude application and is unfamiliar with this constraint. How would you build the application?", "c": ["Configure the application to invoke Claude through the Bedrock-compatible API path while keeping the application's logic provider-agnostic.", "Build two parallel implementations of every call, one for the direct Anthropic API and one for Bedrock, and pick the faster one at runtime.", "Build the application against the direct Anthropic API now and migrate to Bedrock in a follow-up release once the team has more experience with the Bedrock API.", "Build the application against the direct Anthropic API and ignore the contractual requirement to route Claude calls through Amazon Bedrock."], "a": 0, "e": "Option C satisfies both the enterprise routing requirement and sound application architecture. Claude is available through Amazon Bedrock, and Anthropic provides Bedrock-specific SDK integration rather than requiring applications to call api.anthropic.com directly. Current Anthropic documentation describes Claude in Amazon Bedrock as operating through AWSmanaged infrastructure with AWS-native authentication, billing, and security boundaries. Newer Bedrock integrations use the Messages API shape, allowing substantial application logic to remain consistent across provider environments. Anthropic SDKs also provide dedicated Bedrock clients-for example, Python includes AnthropicBedrockMantle for current Bedrock deployments. Keeping business logic separated from provider- specific authentication, endpoints, model identifiers, and transport configuration reduces migration and maintenance risk. A violates architectural simplicity by duplicating every call unnecessarily. B knowingly violates the enterprise requirement until migration occurs. D directly ignores the contractual routing constraint and is therefore invalid regardless of technical feasibility. The correct approach is to make Bedrock the configured inference provider while keeping higher-level application and agent behavior decoupled from provider-specific implementation details. Relevant Claude Developer topics are Claude API mechanics, cloud-provider integrations, Amazon Bedrock, SDK configuration, authentication boundaries, model invocation, and provider abstraction."}, {"id": 63, "q": "Your Claude application returns confident-sounding answers, but occasionally those answers contain factual errors that downstream systems treat as ground truth. The team is concerned about the application's confidence-versus-accuracy gap. How would you address the gap?", "c": ["Apply skepticism toward confident output by adding validation steps, sourcing requirements, or confidence calibration before treating outputs as ground truth.", "Reject every response the application produces until a manual accuracy review is conducted on each response by a human reviewer before any downstream system uses it.", "Add a disclaimer to every output telling users to verify the accuracy of the output and treat the disclaimer as the primary mechanism for managing the confidence-versus-accuracy gap.", "Lower the model's temperature so the model's responses sound less confident and downstream systems are less likely to treat the responses as ground truth in normal operation."], "a": 0, "e": "Option B establishes the correct trust boundary. Fluent or confident language is not evidence that a generated claim is factually correct. If downstream systems treat output as authoritative data, the application must independently establish whether the output meets its correctness requirements before accepting it. Validation can take several forms depending on the workload: compare generated facts against authoritative records, require citations or source references, constrain output to retrieved evidence, apply deterministic business rules, or use separate evaluation/classification stages. Anthropic's agent engineering guidance repeatedly emphasizes explicit evaluation criteria and validation rather than relying on apparent confidence. A confuses sampling behavior with factual reliability. Lowering temperature does not establish factual correctness and may only make an incorrect answer more repeatable. C supplies maximum oversight but is unnecessarily expensive and removes useful automation even for low-risk, easily validated cases. D communicates uncertainty to users but does not protect downstream systems that automatically consume the response. Therefore, B treats model output as untrusted until verified to the level required by the application. Relevant Study Guide topics: output validation, grounding, factuality, confidence calibration, source verification, trust boundaries, and downstream safety."}, {"id": 64, "q": "A teammate has asked you to explain when a Skill would be the right choice over an MCP server. The teammate is unsure how the two differ in practice when both can be reused across teams. How would you explain the distinction?", "c": ["A Skill is preferable for cross-team reuse because it loads more efficiently than an MCP server during normal operation in the team's typical multi-team workloads.", "A Skill is the older mechanism and an MCP server is the newer one, so the team should prefer an MCP server for any reusable capability that the team builds going forward.", "A Skill bundles prompts, scripts, and data into a package the model loads as a unit while an MCP server exposes resources, tools, and prompts through a standard client interface.", "A Skill and an MCP server are equivalent extension mechanisms that the team can use interchangeably for any reusable capability that needs to be accessible across teams."], "a": 2, "e": "The supplied Claude Developer question explicitly identifies D . The two mechanisms solve different extension problems. A Skill is a reusable package of domain expertise and workflow guidance. Anthropic describes Agent Skills as modular, filesystem-based capabilities containing instructions, metadata, and optional supporting resources such as scripts and templates, which Claude can load when relevant. MCP, by contrast, defines a standardized mechanism for exposing external capabilities and context. Anthropic's MCP integration supports MCP tools and, through client-side helpers, MCP prompts and resources. This makes MCP appropriate when Claude must communicate with an external server or reusable service interface rather than simply load packaged expertise. Thus, Skills are appropriate for packaging repeatable instructions, procedures, scripts, templates, or domain knowledge. MCP servers are appropriate for exposing callable operations, external data resources, and shared service capabilities using the Model Context Protocol. A incorrectly treats them as interchangeable. B incorrectly describes the difference as merely generational. C invents a universal efficiency advantage that is not the architectural distinction."}, {"id": 65, "q": "Your Claude application requests structured JSON output from the model. Most of the time the JSON is well- formed, but occasionally Claude returns malformed JSON that breaks downstream processing. How would you handle the malformed output?", "c": ["Add output validation that parses Claude's response against the expected schema and treats malformed output as a recognized error path with retry or fallback handling.", "Manually inspect every response before downstream processing so a human reviewer catches any malformed JSON before the application passes the response to downstream systems.", "Switch to free-form text output so the application no longer depends on JSON parsing for any of the responses it sends to downstream systems during normal operation.", "Retry the same request repeatedly until valid JSON appears in the model's response, with the retry loop adding delay to the application's response time on affected requests."], "a": 0, "e": "Option B establishes a controlled boundary between probabilistic model output and deterministic downstream code. When structured data is machine-consumed, malformed JSON must be recognized as an explicit application error rather than allowed to propagate into parsers, databases, or other services. Anthropic's Structured Outputs documentation identifies malformed JSON, missing fields, inconsistent types, and schema violations as exactly the kinds of failures that can break downstream systems when unconstrained output is used. Current Claude capabilities can constrain responses using JSON Schema, and SDK helpers can provide parsing and validation. Even when an application uses an older or unconstrained generation path, it should parse against the expected schema, record validation failure, and enter a bounded recovery path such as retry, repair, fallback, or controlled rejection. A human review of every request is unscalable. C removes a useful structured interface instead of making it reliable. D performs uncontrolled blind retries and provides no schema-aware error handling or bounded fallback strategy. Therefore, B gives the application explicit failure semantics and protects downstream systems. Relevant Study Guide topics: structured output, JSON validation, schema enforcement, retries, fallback handling, defensive parsing, and downstream reliability."}, {"id": 66, "q": "You are setting up a Claude application that requires API keys for several external services. What is the best way to store the keys?", "c": ["Put the keys in the application's configuration file and check the configuration file into the team's repository alongside the rest of the source code.", "Store the keys in a secrets manager or environment-specific configuration that is not checked into source code, and load them at runtime.", "Email the keys to each developer as needed and have each developer paste the keys into their local environment when they begin working on the application's code.", "Use a single shared key across all external services, so any developer working on the application can find the keys easily during development."], "a": 1, "e": "Option B follows standard secrets-management practice and Anthropic's explicit guidance for API credentials. API keys are authentication secrets and should not be embedded in source code or committed to repositories. Anthropic's authentication documentation explicitly recommends storing API keys in a secrets manager, rotating them periodically, and revoking credentials suspected of compromise. Anthropic SDKs can load Claude credentials from environment variables such as ANTHROPIC_API_KEY, allowing the secret to be injected at runtime instead of compiled into the application. The same principle applies to external service credentials used by a Claude application. Development, staging, and production should normally receive independently scoped credentials through the deployment environment or secret-management infrastructure. A creates a high-probability credential leak because repository history can retain secrets even after a later deletion. C violates isolation and least privilege by sharing credentials across services and users. D uses email as an uncontrolled secret-distribution channel and creates inconsistent manual configuration. Therefore, B supplies credentials only at runtime while keeping them outside source control and enabling rotation and environment-specific access. Relevant Study Guide topics: APIkey management, secrets managers, environment configuration, credential rotation, least privilege, and secure configuration."}, {"id": 67, "q": "Your Claude agent's hooks are currently triggered for every action, which slows down the agent significantly even when actions pose no risk. The team wants to scope hooks more carefully. How would you scope the hooks?", "c": ["
