Replace hooks with system prompt instructions on the grounds that prompt instructions can produce the same enforcement effect that hooks produce on the agent's actions.", "Disable the agent during peak hours so the hook overhead does not slow the application down during the busiest periods of the day across the application's operation.", "Disable all hooks while the team re-scopes them, treating the period of no hook enforcement as a temporary state during the re-scoping work.", "Scope hooks to only the high-risk actions, such as destructive operations or sensitive data access, and remove hooks from low-risk actions to balance safety with performance."], "a": 3, "e": "Option A correctly applies selective enforcement. Claude Code hooks can execute automatically at lifecycle events such as PreToolUse, and matchers or conditions can narrow exactly which operations trigger a hook. Anthropic's hook reference demonstrates this pattern by applying a PreToolUse hook specifically to destructive shell operations rather than indiscriminately processing every command. The documentation notes that if the matcher or conditional expression does not match, the handler is skipped, avoiding unnecessary process-spawn overhead. That architecture is particularly appropriate for costly or security-sensitive checks. High-risk events- destructive file operations, privileged commands, production changes, or access to sensitive resources-can receive deterministic pre-execution enforcement while routine lowrisk actions proceed without additional hook latency. B creates an avoidable period in which safeguards disappear entirely. C reduces application availability without addressing the actual source of overhead. D is technically weaker because system-prompt instructions influence model behavior but are not equivalent to deterministic lifecycle interception capable of blocking execution. Therefore, hooks should be scoped using event types, matchers, and conditions according to risk. Relevant Claude Developer topics are Claude Code hooks, agent construction, tool governance, deterministic controls, permission boundaries, safety/performance tradeoffs, and lifecycle interception."}, {"id": 68, "q": "You are building an MCP server that exposes several internal data sources as MCP resources. The server needs to be deployed so multiple Claude applications can integrate with it. How would you approach the build and deployment?", "c": ["Deploy the MCP server only on individual developer machines, with the Claude applications unable to reach the server outside each developer's machine.", "Author the server with clearly defined resources, tools, and prompts, choose a communication pattern, and deploy to an accessible hosting environment.", "Bypass the MCP server and embed each data source directly in every Claude application that needs the data, with each application maintaining its own integration.", "Build the MCP server with resource and tool definitions scoped to the first Claude application that needs it, and extend the definitions to additional applications as each integration is requested."], "a": 1, "e": "Option A correctly treats the MCP server as a reusable integration boundary rather than application-specific code. Model Context Protocol separates capability providers from consuming Claude applications by exposing standardized tools, resources, and prompts through an MCP-compatible interface. A shared server therefore needs explicit capability definitions, an appropriate transport or communication pattern, and a deployment location reachable by its intended clients. Anthropic's MCP documentation distinguishes remote HTTP-based integrations from local/client-managed connections. For remotely shared services, the server must be reachable from the consuming environment; client-side MCP helpers additionally support broader MCP capabilities such as resources and prompts. B unnecessarily couples the server design to the first consumer and encourages applicationspecific evolution of what should be a reusable service boundary. C prevents multiapplication deployment because only local developer sessions could reach the service. D abandons MCP entirely and recreates duplicated integrations in every consuming application . Thus, A provides the correct lifecycle: define the MCP contract, expose resources/tools/prompts appropriately, select the transport according to topology, deploy the service, and let multiple applications consume the standardized interface independently. Relevant Study Guide topics: MCP architecture, reusable services, tools, resources, prompts, transports, and deployment topology."}, {"id": 69, "q": "Your Claude application receives untrusted input from external sources. The team is establishing how the application should treat this untrusted input. Untrusted input would be…", "c": ["Validated and sanitized before being incorporated into prompts, and treated as data the model should not interpret as instructions.", "Blocked entirely so the application accepts only trusted input, with no path for legitimate external input the application might process.", "Routed through a separate Claude application with more lax security controls so the original application does not handle the untrusted input directly.", "Treated identically to trusted input from internal sources, on the grounds that all input the application receives can be handled the same way."], "a": 0, "e": "Option A is the appropriate trust-boundary treatment for external content. Untrusted text can contain malformed data, adversarial instructions, prompt-injection attempts, or content deliberately constructed to alter the agent's behavior. It should therefore be validated or screened before inclusion and clearly represented as untrusted data rather than authoritative application instructions. Anthropic's prompt-injection guidance distinguishes direct attacks from indirect prompt injection, where Claude processes third-party content such as webpages, emails, documents, or tool output containing hostile instructions. Anthropic recommends input validation and screening, least-privilege access, safe treatment of untrusted tool content, and screening content before Claude acts on it. Importantly, Anthropic notes that tool- result content is treated as untrusted data rather than as a reliable place for application instructions. B erases the trust distinction and exposes the application to instruction/data confusion. C introduces a deliberately weaker security boundary and does not sanitize the data. D prevents legitimate use cases unnecessarily; untrusted does not mean unusable-it means the data must be handled defensively. Therefore, A correctly combines validation with explicit trust separation. Relevant Study Guide topics: prompt injection, untrusted content, input validation, sanitization, data/instruction separation, least privilege, and defense in depth."}, {"id": 70, "q": "Your Claude application's token costs have grown faster than expected. The team has not been tracking token usage by feature, so the team cannot identify which features are driving cost. The team is debating how to respond. How would you respond?", "c": ["Reduce token usage uniformly across all features by half, applying the cut evenly across the application during normal operation.", "Tell the team that cost growth is unavoidable as the application scales and that no investigation will change the trajectory of the application's cost over the next several quarters.", "Add token usage tracking by feature to the application's logging so the team can identify which features drive cost before recommending changes.", "Switch every feature to the smallest model to cut cost broadly across the application during normal operation."], "a": 2, "e": "Option D follows the fundamental optimization rule of measuring before changing. Without feature-level usage telemetry, the team cannot know whether cost growth comes from request volume, long prompts, excessive outputs, low cache-hit rates, expensive models, agent loops, tool results, or one particularly inefficient workflow. Anthropic's Usage and Cost API exists specifically to provide granular historical usage and cost information. It supports token tracking and breakdowns by dimensions including model, workspace, service tier, API key, context window, and other usage characteristics. Anthropic describes this data as useful for monitoring, cost reconciliation, optimization, and determining whether system changes improve efficiency. B applies a model downgrade indiscriminately and may damage features whose quality requirements genuinely demand a stronger model. C similarly imposes an arbitrary token reduction without identifying where waste exists. A abandons cost management entirely. The correct lifecycle is instrument, establish a baseline, identify high-cost features, analyze why they are expensive, apply targeted optimizations, and measure again. Relevant Study Guide topics: observability, usage telemetry, cost attribution, token accounting, production monitoring, capacity planning, and evidence- driven optimization."}, {"id": 71, "q": "You are reviewing an architectural diagram for a Claude-powered travel-booking system. The diagram shows a top-level component that interprets user requests and three subordinate components that handle flights, hotels, and ground transportation. The top-level component is responsible for routing each request, sequencing the subordinate components, and reconciling their outputs into a final itinerary. The diagram also shows that each subordinate component has its own tool list and own short conversation history that is not shared with the others. Which architectural pattern does this diagram most closely describe?", "c": ["A manager and supervisor pattern with shared context, where the top-level agent and the subagents all share a single conversation history that grows as the request flows through the system.", "A pipeline pattern, where each component processes the user request in sequence and passes the full conversation history along with the request to the next component in the pipeline.", "A manager and supervisor pattern with isolated context per subagent, where the top-level agent coordinates specialized subagents that each maintain their own conversation history and tool list.", "A retrieval-augmented pattern, where the top-level component retrieves relevant context from the subordinate components' indexed data stores before generating each response."], "a": 2, "e": "The architecture is a manager/supervisor-or orchestrator/subagent-pattern with isolated subagent context. The defining characteristics are a coordinating top-level agent, specialized subordinate agents, delegated responsibilities, and distinct tool/context boundaries. The supervisor determines which specialist should act, sequences work where necessary, and integrates the specialists' outputs into the final result. Anthropic's published multi-agent research architecture uses this same structural principle. Its Research system employs an orchestrator-worker pattern in which a lead agent analyzes the task, creates specialized subagents, delegates separate research responsibilities, and consolidates their findings. Anthropic emphasizes that good delegation requires each subagent to receive a specific objective, task boundaries, expected output, and appropriate tools. The question additionally specifies that each travel specialist has its own conversation history and tool list. That eliminates B because context is explicitly not shared globally. C would involve fixed sequential processing rather than supervisor-directed specialization. D describes retrieval augmentation, not autonomous subordinate agents. Therefore, A precisely matches both the hierarchy and context-isolation characteristics described. The supplied examination set also marks A as the intended answer. Relevant topics: Agent Patterns, manager /supervisor architecture, orchestrator-worker systems, subagents, delegation, specialized tools, and context isolation."}, {"id": 72, "q": "You are building a Claude application that processes 10,000 customer emails overnight to extract structured data. The work is non-interactive, runs once daily, and has a flexible completion window of several hours. Which Claude API would you use?", "c": ["The real-time Messages API with concurrent requests to process the emails as fast as possible during the overnight window.", "The Batch API, which is designed for non-interactive workloads with flexible completion windows.", "The streaming responses API to process each email and return partial results to a database as the model generates them.", "The real-time Messages API, processing the emails one at a time sequentially to ensure consistent ordering of results."], "a": 1, "e": "Option A is correct because the Message Batches API is designed for asynchronous, highvolume processing where results do not need to be returned interactively. Anthropic's API reference states that a Message Batch can contain many independent Messages requests and may take up to 24 hours to complete. That makes it appropriate for 10,000 overnight email-extraction jobs with a several-hour completion window. Streaming in B solves a different requirement: it exposes partial response events while a single request is being generated, which is valuable for interactive user experiences or longrunning synchronous requests, but it does not provide the workload-management advantages of a batch job. C processes items sequentially and unnecessarily sacrifices throughput. D can increase throughput with concurrent real-time calls, but it adds concurrency management and rate-limit pressure when the workload explicitly tolerates asynchronous completion. The batch design also lets each request carry a custom identifier so results can be matched back to source emails even if completion order differs. Therefore, A is the intended Claude API choice. Relevant Study Guide topics: Message Batches API, asynchronous processing, high-volume workloads, request correlation, throughput, and non-interactive application design."}, {"id": 73, "q": "Your Claude application's error handling currently logs every API error with the same severity level. The team wants to differentiate between errors that should page an on-call engineer and errors that should be logged for later review. How would you structure the error handling?", "c": ["Categorize errors by severity based on impact and recoverability, then route each category to the appropriate channel for paging or logging.", "Log every error with the same severity, on the grounds that differentiating severity adds complexity that does not pay off in most application setups over time.", "Disable logging for any error that does not page, treating non-paging errors as not worth recording for later review either.", "Page on every error, on the grounds that paging guarantees that no error is missed by the team during normal operation across the application's lifecycle."], "a": 0, "e": "Option C is correct because operational error handling should distinguish failures by impact, urgency, and recoverability. Anthropic's API documentation already separates error conditions by type and documents different recovery behaviors. For example, transient connection failures, rate limits, and many 5xx errors are automatically retried by official SDKs with exponential backoff, while other failures require application correction or investigation. Treating all of those conditions as the same operational severity creates either alert fatigue or missed incidents. A production design should classify errors using criteria such as user impact, data integrity risk, security exposure, persistence after retry, affected request volume, and whether automatic recovery succeeds. High- severity failures that threaten service availability or correctness can page the on-call engineer. Recoverable or isolated failures can be logged with structured metadata, request IDs, and metrics for later review. Option A pages on everything and quickly makes alerts noisy. Option B destroys observability for non-paging errors. Option D preserves the original defect by assigning the same severity to every condition. Therefore, C follows sound Claude application operations. Relevant Study Guide topics: API errors, retries, observability, incident response, severity classification, structured logging, and production operations."}, {"id": 74, "q": "Your agent is processing tasks that take 30 to 60 minutes to complete. Each task has welldefined intermediate checkpoints, and the team wants the agent to be able to resume from the most recent checkpoint if a process is interrupted. How would you implement this resumability?", "c": ["Restart the task from the beginning whenever a process is interrupted.", "Increase the agent's timeout to several hours so that interruptions become rare enough to ignore in practice.", "Run two copies of the agent in parallel for every task and use whichever one finishes first as the source of truth.", "Apply a checkpointing pattern that persists the agent's intermediate state and reloads that state when resuming an interrupted task."], "a": 3, "e": "Option B is the correct fault-tolerance pattern for a long-running stateful workflow. A checkpoint captures enough durable execution state-completed steps, intermediate results, pending work, identifiers, and other necessary task state-to restart from a known consistent point rather than replaying the entire workflow after interruption. This pattern is consistent with Claude's current stateful agent architecture. Anthropic's Managed Agents documentation describes persistent sessions that preserve conversation history across interactions. When a session becomes idle, its sandbox can be checkpointed so filesystem and execution artifacts are available when work resumes. The certification concept is broader than that specific hosted implementation: long- running agent systems should externalize recoverable state at meaningful boundaries. A longer timeout does not protect against process crashes, infrastructure restarts, network failures, or deployment interruptions. C doubles resource consumption and creates consistency problems without providing deterministic recovery. D wastes completed work and may repeat external side effects. Therefore, B provides controlled resumability and minimizes repeated processing. Relevant Study Guide topics: checkpointing, persistent state, resumable workflows, long-running agents, fault tolerance, idempotency, and recovery architecture."}, {"id": 75, "q": "Your Claude agent performs database operations. A recent incident occurred where the agent ran a destructive query that affected production data. The team wants to add deterministic controls to prevent similar incidents. How would you prevent similar incidents?", "c": ["Switch to a higher-capability Claude model on the grounds that a more capable model is less likely to run destructive queries during normal operation across all requests.", "Add a system prompt instruction telling the agent to be careful with database operations on every request the application handles during normal operation across all incoming traffic.", "Add Claude hooks that intercept database operations and apply deterministic checks, such as blocking destructive queries or requiring approval, before the queries execute.", "Run the agent only during business hours when humans are available to monitor its activity, treating the schedule as the primary control mechanism for destructive operations."], "a": 2, "e": "Option B is correct because destructive production operations require deterministic enforcement outside the model's probabilistic reasoning. Claude Code hooks can intercept lifecycle events before tool execution and explicitly allow, deny, or request further handling based on concrete rules. Anthropic's hooks documentation provides this exact security pattern. A PreToolUse hook can inspect a proposed command before execution and return a blocking decision. Anthropic's example demonstrates blocking destructive operations such as drop table, while other commands proceed normally. That mechanism can be adapted to database controls: block DROP, destructive DELETE, unauthorized schema modifications, or production writes; require explicit approval for highrisk operations; and allow read- only or known-safe queries automatically. A merely increases the probability that someone might notice an unsafe operation and does not prevent execution. C assumes model capability can replace access controls, which is an unacceptable safety boundary. D is useful behavioral guidance but remains probabilistic and cannot guarantee prevention. Therefore, B creates a deterministic control between model intent and side-effect execution. Relevant Study Guide topics: Claude hooks, PreToolUse, tool governance, deterministic enforcement, approval gates, least privilege, and destructive-operation protection."}, {"id": 76, "q": "You are designing a Claude application that processes user-submitted text. Some of that text could include sensitive information such as account numbers or passwords that the application should not send to Claude. How would you design the application?", "c": ["Log all user-submitted text before it is sent to Claude and review the logs periodically to identify whether sensitive information is reaching the model.", "Define the application boundary explicitly, identify what content can leave the boundary for Claude, and add filtering or redaction at the boundary.", "Apply filtering at the boundary for the most commonly observed sensitive data patterns and expand coverage to additional patterns based on findings from production monitoring.", "Add a prompt instruction in the system prompt specifying the categories of sensitive information Claude should disregard when processing user-submitted text."], "a": 1, "e": "Option A is correct because sensitive-data protection must occur before prohibited information crosses the application's trust boundary. If account numbers, passwords, or other secrets must not be sent to Claude, asking Claude to \"ignore\" those values after transmission does not satisfy the requirement. The application must determine which data is permitted to leave its controlled environment and transform or reject prohibited content before constructing the Claude request. This principle is consistent with Anthropic's defense-in-depth guidance. Anthropic recommends input screening, limiting Claude's access to sensitive information, and applying least privilege so the model receives only information necessary for the task. B is fundamentally too late: the sensitive information has already been transmitted to the model context before the system instruction can influence behavior. C is worse because logging can create an additional store containing the sensitive information and only detects exposure after it occurs. D implements some boundary filtering but deliberately leaves coverage incomplete until production incidents reveal additional patterns. Therefore, A requires the boundary and its permitted data flows to be defined first, then enforced comprehensively through filtering, redaction, tokenization, or rejection. Relevant Study Guide topics: application boundaries, data minimization, sensitive-data handling, filtering, redaction, least privilege, and privacy-preserving design."}, {"id": 77, "q": "A teammate has submitted a pull request that adds a Claude-powered feature to your service. The code works, but the prompt and model selection are hard-coded inline, error handling is missing, and there are no tests for the integration. What would you request during code review?", "c": ["Approve the pull request as-is, on the grounds that the feature works in the happy path and the missing pieces can be added in follow-up commits.", "Request changes that move prompt and model configuration to a configurable location and add tests, treating the missing error handling as a follow-up release item.", "Request changes that move prompt and model configuration to a configurable location, add error handling for Claude API failures, and add tests for the integration.", "Approve the pull request and add the missing pieces yourself in a follow-up commit so the teammate can move on to other work immediately."], "a": 2, "e": "D is the only option that addresses all three identified production-readiness defects. The supplied Claude Developer item explicitly selects D. A functioning happy path is insufficient for a maintainable Claude integration. Prompt and model selection are configuration concerns that will change as prompts are evaluated, model versions evolve, or environments require different behavior. They should therefore be separated from unrelated business logic rather than scattered as inline constants. Claude API failures must also be handled deliberately. Anthropic documents typed SDK exceptions and defined HTTP error categories, including invalid requests, authentication failures, rate limits, server errors, overload, and timeouts. The official SDKs additionally retry appropriate transient failures. Tests are required to verify the integration boundary, including successful behavior, malformed or unexpected responses, API error handling, and critical user workflows. Approving code without those controls pushes known reliability debt directly into production. A and B knowingly merge incomplete production behavior. C improves configuration and test coverage but leaves a known API-failure path unhandled."}, {"id": 78, "q": "A new agent your team built handles customer support tickets, but it routinely gets confused when a single ticket spans billing, shipping, and product issues. The agent often loses track of which sub-issue it has already addressed and revisits the same one. The team is considering architectural changes. What architectural change would you recommend?", "c": ["Introduce an orchestrator agent that delegates billing, shipping, and product sub-issues to dedicated subagents.", "Switch to a deterministic workflow that handles billing, shipping, and product issues in a fixed sequence.", "Add detailed prompting that instructs the agent to track which sub-issues have been resolved and which remain.", "Increase the size of the agent's context window so it can hold the full ticket history at once."], "a": 0, "e": "Option A applies an orchestrator-worker architecture to a request containing several distinct domains. Rather than making one agent continuously switch between billing, shipping, and product reasoning, an orchestrator can decompose the ticket, delegate each concern to an appropriately scoped specialist, track completion, and consolidate the resulting recommendations. Anthropic describes this architecture directly: an orchestrator dynamically breaks down a task, delegates subtasks to worker agents, and synthesizes their results. Anthropic's multiagent Research system similarly uses a lead agent that coordinates specialized subagents operating with independent contexts. A rigid workflow is inappropriate because not every ticket contains the same combination or ordering of issues. B can improve behavior but leaves one agent responsible for managing all competing concerns and state. D increases raw context capacity without addressing decomposition or responsibility boundaries. C is therefore the strongest architectural change when separate issue categories can be handled independently and then reconciled by a coordinating component. Relevant Study Guide topics: orchestrator-workers, subagents, delegation, task decomposition, context isolation, coordination, and synthesis."}, {"id": 79, "q": "Your team uses several plugins across multiple Claude applications, and a recent plugin update introduced a regression. The team had not been tracking plugin versions, so the team cannot easily identify which version was previously working. How would you address this?", "c": ["Upgrade every plugin to the latest version on a regular cadence to keep version drift small, on the grounds that drift contributes to regression risk.", "Add explicit plugin version tracking to the project's configuration so the team can identify, pin, and upgrade plugin versions deliberately.", "Treat plugins as untrackable third-party code and rely on plugin authors to communicate breaking changes when they happen, with no internal version tracking.", "Stop using all plugins until the team can rebuild equivalent functionality directly into the application code, treating plugin avoidance as a way to remove version-related risk."], "a": 1, "e": "Option B is correct because plugin dependencies and releases must be versioned deliberately if the team wants reproducible behavior and a reliable rollback path. Claude Code's plugin documentation supports explicit semantic versions in plugin manifests and marketplace entries, and the plugin system uses the resolved version as part of update detection and caching. Version constraints can also keep dependent plugins on a tested compatible range until the team intentionally upgrades. The incident happened because the team could not determine which plugin version had previously worked. Explicit tracking solves that directly: record the version in project configuration, pin knowngood releases where stability matters, test upgrades, and change versions through reviewed configuration updates. This creates traceability and makes regression isolation much faster. Option A removes useful extension functionality instead of managing it. Option C treats thirdparty change as uncontrollable even though the platform provides version-management mechanisms. Option D automatically moving everything to the latest release increases change frequency and can reproduce the same regression problem. Therefore, B is the correct configuration-management response. Relevant Study Guide topics: Claude Code plugins, semantic versioning, dependency constraints, reproducible configuration, controlled upgrades, rollback, and configuration management."}, {"id": 80, "q": "You are designing an agent that handles a complex claim-processing workflow. Each claim moves through fact extraction, eligibility evaluation, and a decision step. The three subtasks have distinct success criteria, and some claims require iteration between fact extraction and eligibility evaluation before a decision can be reached. Which agent pattern would you apply?", "c": ["A streaming pattern that emits partial decisions as the agent processes each claim, refining the output until a final decision emerges from the stream.", "A linear chain pattern that processes every claim through fact extraction, then eligibility evaluation, then decision, with no return paths between subtasks.", "A single tool-use loop pattern that gives one agent access to all the tools needed for fact extraction, eligibility evaluation, and decision-making.", "A graph-based pattern that lets the agent move between subtasks based on the state of each claim, with each subtask evaluated against its own criteria."], "a": 3, "e": "A is correct because the workflow is state-dependent, non-linear, and iterative . The source explicitly identifies the graph-based pattern as the intended architecture for this scenario. Each stage-fact extraction, eligibility evaluation, and decision-making-has its own completion criteria, and the process may need to move backward from eligibility evaluation to fact extraction when information is incomplete. A graph representation naturally models these conditional transitions and loops. Anthropic's current orchestration guidance supports workflows containing branching, loops, filtering, staged execution, and state-dependent control flow , rather than forcing every task through one fixed sequence. Dynamic workflow orchestration can use explicit control logic so the next processing stage depends on current state and previous results. B concerns progressive output delivery, not workflow-state transitions. C provides a generic agentic tool loop but does not explicitly model distinct states or transition criteria. D is unsuitable because it prohibits the required return path between extraction and eligibility evaluation. Therefore, a graph-based architecture provides the necessary conditional routing, iteration, and stage-specific validation."}, {"id": 81, "q": "A teammate has asked why your Claude application sometimes produces a response that includes the prompt text repeated back, and other times produces a response with the prompt text rephrased. They suspect a bug in the application's request construction. How would you respond?", "c": ["Tell the teammate that the variation is caused by the application sending two different prompts on different runs and propose a code change that pins the system prompt to a single version.", "Confirm that the variation is a bug in the application's request construction and start investigating which part of the application is producing the inconsistent prompt text.", "Tell the teammate that the variation depends on which Claude model serves the request, and recommend pinning the application to a single model version to make the output behavior consistent.", "Explain that LLMs generate output token by token, and variation in how prompt content appears in output is a property of generation, not a bug in request construction."], "a": 3, "e": "Option B reflects the fundamental generative behavior of large language models. Claude does not retrieve a fixed response template for a given prompt. Instead, it generates the response incrementally, selecting subsequent tokens according to the probability distribution produced by the model. Consequently, semantically equivalent runs can differ in wording, ordering, whether prompt language is quoted, and whether it is paraphrased. Anthropic's API documentation explicitly describes sampling parameters as controlling randomness in subsequent-token selection and also states that even configurations intended to minimize randomness do not make output completely deterministic. Current Claude model generations increasingly manage sampling internally, but the underlying principle remains: generative output is not guaranteed to be textually identical across equivalent calls. Therefore, seeing the original prompt echoed in one response and paraphrased in another does not, by itself, demonstrate malformed request construction. A real request-construction problem should instead be established through traces showing different system instructions, messages, parameters, or context. A, C, and D incorrectly infer specific implementation faults without supporting evidence. The supplied question identifies B as the correct response. Relevant topics: SW Eng Foundations, token generation, sampling, nondeterminism, debugging, and model behavior."}, {"id": 82, "q": "A new agent your team built handles customer support tickets, but it routinely gets confused when a single ticket spans billing, shipping, and product issues. The agent often loses track of which sub-issue it has already addressed and revisits the same one. The team is considering architectural changes. What architectural change would you recommend?", "c": ["Add detailed prompting that instructs the agent to track which sub-issues have been resolved and which remain.", "Introduce an orchestrator agent that delegates billing, shipping, and product sub-issues to dedicated subagents.", "Increase the size of the agent's context window so it can hold the full ticket history at once .", "Switch to a deterministic workflow that handles billing, shipping, and product issues in a fixed sequence."], "a": 1, "e": "Option C applies an orchestrator-worker architecture to a request containing several distinct domains. Rather than making one agent continuously switch between billing, shipping, and product reasoning, an orchestrator can decompose the ticket, delegate each concern to an appropriately scoped specialist, track completion, and consolidate the resulting recommendations. Anthropic describes this architecture directly: an orchestrator dynamically breaks down a task, delegates subtasks to worker agents, and synthesizes their results. Anthropic's multiagent Research system similarly uses a lead agent that coordinates specialized subagents operating with independent contexts. A rigid workflow is inappropriate because not every ticket contains the same combination or ordering of issues. B can improve behavior but leaves one agent responsible for managing all competing concerns and state. D increases raw context capacity without addressing decomposition or responsibility boundaries. C is therefore the strongest architectural change when separate issue categories can be handled independently and then reconciled by a coordinating component. Relevant Study Guide topics: orchestrator-workers, subagents, delegation, task decomposition, context isolation, coordination, and synthesis."}, {"id": 83, "q": "Your application uses the Messages API to handle multi-turn conversations. Each new turn resends the entire conversation history, and your token costs are growing as conversations get longer. You suspect there is a more efficient approach. How would you address this?", "c": ["Truncate every conversation to the last two messages so that token usage stays low and costs remain predictable across the application's normal operation.", "Switch to the Batch API for every turn so the per-call cost is reduced, treating the batch as the team's primary cost-control mechanism for multi-turn work.", "Use prompt caching to reuse the static portions of the conversation context across turns instead of paying for them at the normal input-token rate on every request the application sends.", "Summarize each conversation after every turn and replace the full history with the summary on the next request, reducing token count at the cost of fidelity."], "a": 2, "e": "Option A is the technically verified answer. Anthropic documents that multi-turn agentic requests resend the growing conversation context on subsequent turns. Prompt caching allows repeated prompt prefixes-such as system instructions, tool definitions, and prior unchanged conversation content-to be reused at the lower cache-read rate rather than repeatedly charged as ordinary uncached input. Anthropic specifically identifies caching repeated context as a major production cost optimization. B is incorrect even though the supplied PDF contains a duplicated screenshot in which B appears selected. The Batch API is designed for asynchronous workloads that can tolerate delayed completion; it is not the appropriate mechanism for every interactive turn in a multi-turn conversation. Because the user requested verified answers rather than blindly reproducing marked selections, A is retained. C discards potentially essential conversation state arbitrarily. D is a valid contextmanagement technique in some long-running workflows, but summarizing after every turn creates additional model work and loses detail; it does not exploit repeated-prefix caching. Therefore, A directly addresses the stated cost pattern while preserving conversation fidelity. Relevant Study Guide topics: Messages API, stateless conversation history, prompt caching, cached input tokens, multi-turn applications, token economics, and cost optimization."}, {"id": 84, "q": "A teammate is debugging a Claude application whose system prompt has grown to several hundred lines and now contains overlapping, contradictory, and obsolete instructions. How would you advise the teammate?", "c": ["Add more explicit instructions so the most recent rules dominate the model's interpretation of the prompt during each request.", "Split the prompt across multiple system prompts so the model sees a smaller portion at any given time.", "Audit the prompt for overlap, contradiction, and obsolete content, then refactor so each instruction is clear, current, and non-redundant.", "Tighten only the contradictory rules first, treating the overlap and obsolete content as lower-priority work the team can address later."], "a": 2, "e": "Option B is correct. A large prompt containing overlapping, contradictory, or obsolete instructions creates instruction ambiguity and increases the likelihood that Claude will apply an unintended rule, over-weight irrelevant guidance, or produce inconsistent behavior. Anthropic's current prompting guidance reinforces this principle: Claude performs best when instructions are clear, explicit, and direct. Prompt design should minimize ambiguity and provide the model with precisely the context and behavioral requirements needed for the task. Refactoring should therefore remove obsolete requirements, consolidate duplicated instructions, resolve contradictions, and establish one authoritative formulation for each behavioral rule. The revised prompt should then be regression-tested against representative inputs. A makes an already overloaded prompt larger and relies on instruction ordering instead of eliminating conflicts. C addresses only one defect while retaining redundant and obsolete material. D does not inherently solve contradictions and may fragment authoritative instructions across multiple locations. Therefore, B addresses the root cause. Relevant Study Guide topics: system prompt design, prompt maintainability, instruction clarity, conflicting instructions, prompt refactoring, regression evaluation, and context quality."}, {"id": 85, "q": "You are deciding between Claude models for a task. The team has identified three relevant tradeoff dimensions: quality, latency, and cost. The right model is the one that…", "c": ["Meets the task's cost target within a defined latency budget, with quality validated against a representative sample of inputs after the model is selected.", "Fits the task's quality, latency, and cost requirements together, recognizing that improving one dimension typically affects the others.", "Satisfies the task's latency requirement first, then is evaluated against quality and cost thresholds to confirm the selection is acceptable across all three dimensions.", "Meets the task's quality requirements at an acceptable latency, with cost reviewed separately once the quality and latency bar has been established."], "a": 1, "e": "The supplied Claude Certified Developer Foundations source marks C . Model selection is a multidimensional engineering decision. There is no universally correct Claude model independent of workload requirements; the application must satisfy the required capability or quality while remaining within acceptable latency and cost envelopes. Anthropic's official model-selection guidance explicitly identifies capabilities, speed, and cost as core considerations and recommends testing models against workload-specific benchmarks rather than selecting them from a single metric. The guidance further recommends evaluating actual prompts and data, comparing response accuracy, quality, and edge-case behavior, and then weighing the resulting performance and cost tradeoffs. Options A, B, and D each establish one or two dimensions as primary and effectively defer the remainder. That can lead to a technically unsuitable model-for example, a cheap model that fails the quality threshold or a high-quality model whose latency makes the user experience unacceptable. The correct method is to define minimum acceptable thresholds across all relevant dimensions and benchmark candidate models against the actual workload."}, {"id": 86, "q": "A teammate has asked you to explain why your Claude agent's tools include detailed descriptions in the tool definition, even when the tool name is already descriptive. The teammate suggests removing the descriptions to simplify the tool definitions. How would you respond?", "c": ["Agree with the teammate because tool names are sufficient for the model to choose the right tool on every request the agent handles.", "Explain that the model uses the tool description to decide when to call the tool, and descriptions disambiguate cases where the tool name is not enough.", "Suggest moving the descriptions out of the tool definition and into a separate documentation file the team maintains so the tool definitions stay short and the descriptions remain available.", "Suggest replacing the descriptions with example calls embedded in the tool definition, treating example calls as a complete substitute for the prose description."], "a": 1, "e": "The supplied exam source identifies C . Tool descriptions are part of Claude's runtime decision context. A descriptive function name can indicate what a tool appears to do, but it may not clearly tell Claude when to use it, when not to use it, what assumptions apply, or how it differs from similar tools . Anthropic's official tool-use documentation states that Claude determines whether to call a tool based on the user's request and the tool's description. Its tool-definition guidance defines description as detailed plaintext describing what the tool does, when it should be used, and how it behaves. Anthropic's troubleshooting guidance also identifies ambiguous descriptions as a cause of selecting the wrong tool and recommends differentiating tools by when they should be used, not only by what they do. A can supplement descriptions with examples but should not universally replace them. B incorrectly assumes names provide sufficient semantics. D removes the information from Claude's actual decision context. Therefore, tool descriptions are operational metadata for model routing, not merely documentation for developers."}, {"id": 87, "q": "Your Claude application processes 50-page legal contracts and produces summaries with citation references back to the source. The team is debating whether to send each contract whole or split it into smaller pieces. The contracts fit within Claude's context window. Initial testing shows that whole-document processing produces summaries with stronger cross-section reasoning but occasionally drifts on citation accuracy in later sections. Chunked processing produces stronger citation accuracy per chunk but loses cross-section reasoning. The team has not decided which property matters more. How would you guide the team's decision?", "c": ["Review the citation accuracy results from chunked processing and determine whether the loss of cross- section reasoning produces summaries that still meet the application's quality bar.", "Identify which property matters more for the application's actual use case and let that decision drive the chunking approach, then validate the choice against representative contracts.", "Assess the cost and latency implications of both approaches against the application's performance requirements before recommending which processing strategy to adopt.", "Examine the use cases where cross-section reasoning failures occur and assess whether whole- document processing meets the application's accuracy requirements across a representative sample of contracts."], "a": 1, "e": "B is correct because the architecture cannot be chosen intelligently until the team defines which quality attribute is more important to the actual business use case . The examination source explicitly selects B. Whole-document and chunked processing each perform better on different dimensions, so there is no universally superior option. Anthropic's evaluation guidance emphasizes defining concrete success criteria first and validating candidate approaches against representative examples. The correct sequence is therefore to determine whether cross- section reasoning or citation precision is the more critical requirement, establish measurable acceptance thresholds, and evaluate both strategies on representative legal contracts. Anthropic's legal summarization guidance also confirms that chunking or metasummarization is useful for long documents, while acknowledging that processing an entire document can be appropriate when it fits within Claude's context window. For citations specifically, Anthropic provides native citation support that chunks document text into citationaddressable units and improves source-grounded citation behavior. A and C each privilege one quality dimension before establishing business priority. D focuses on cost and latency even though the unresolved problem is quality tradeoff."}, {"id": 88, "q": "Your Claude application's outputs are inconsistent in format. The team's instructions are scattered across the system prompt and user messages, with some instructions stated only once and others repeated. How would you fix the inconsistency?", "c": ["Consolidate behavioral and format instructions in the system prompt and keep user messages focused on the user's input.", "Repeat all instructions in both the system prompt and the user message so the model sees each instruction more than once.", "Move all instructions into the user message so the application's behavior is controlled at the input point.", "Place each instruction wherever the developer who first wrote it found most natural, retaining the original intent."], "a": 0, "e": "Option B creates a clear separation between persistent application instructions and perrequest user content. Stable behavioral rules-role, output conventions, formatting constraints, policies, and other instructions intended to apply across requests-belong in the system-level instruction layer. User messages should primarily carry task-specific input and requirements that vary from interaction to interaction. Anthropic's Messages API defines the system prompt specifically as the mechanism for providing overarching context and instructions to Claude. Current guidance likewise recommends the top-level system field for instructions that should apply from the beginning of the conversation, while more transient information belongs in conversation messages. A mixes persistent application behavior with user-controlled content and weakens separation of concerns. C preserves the inconsistent architecture responsible for the problem. D duplicates instructions unnecessarily, wastes context tokens, and increases the possibility that future edits create conflicting versions of the same rule. Consolidating stable instructions also makes prompts easier to version, evaluate, review, and maintain. Therefore, B is the correct design. Relevant Study Guide topics: system prompts, instruction hierarchy, prompt organization, formatting consistency, separation of concerns, and maintainable prompt construction."}, {"id": 89, "q": "You are implementing a custom tool for your Claude agent. The tool needs to interact with an external pricing service that returns product data. Which of the following best practices would you apply as you develop this tool?", "c": ["Implement the tool with no error handling and let the agent loop catch failures whenever the pricing service returns an error during operation.", "Define the tool with a clear schema, write a precise description for when to call it, and handle pricing service errors explicitly.", "Omit the tool description and let the model infer when to use the tool based on the tool's name and the rest of the prompt context.", "Define the tool with a loose schema and let the model interpret the inputs flexibly on each call the agent makes."], "a": 1, "e": "Option D combines the three key properties of a reliable Claude tool: an explicit contract, clear tool-selection guidance, and controlled execution failure handling. Anthropic's tool documentation defines user tools using a name, detailed description, and JSON input_schema. The description should explain what the tool does, when it should and should not be used, parameter semantics, and relevant limitations. Anthropic emphasizes that precise descriptions materially improve Claude's ability to select the correct tool. A clear schema prevents ambiguous parameter interpretation and allows validation before calling the external pricing API. Where stronger guarantees are required, Anthropic also supports strict tool use, which constrains generated tool inputs to the declared JSON Schema. The application's execution layer must also convert pricing-service failures into explicit, handled error paths rather than uncontrolled exceptions. A deprives Claude of critical selection information. B increases malformed-call risk. C delegates infrastructure reliability to the reasoning loop instead of implementing appropriate integration error handling. Therefore, D represents production-quality custom-tool construction. Relevant Study Guide topics: custom tools, JSON Schema, tool descriptions, validation, external API integration, and error handling."}, {"id": 90, "q": "A teammate is reviewing the team's threat model for a Claude application and has asked you to identify the categories of AI-specific threats that the model should cover. The teammate has already listed traditional web application threats and wants to know what additional categories apply to a Claude application. Which AI-specific threat categories would you add?", "c": ["Supply chain attacks on the Claude SDK because the SDK itself is the only point of vulnerability that a Claude application introduces beyond traditional web application threats.", "Network-level denial of service and physical infrastructure attacks, because these categories cover the threats most likely to affect any Claude application in production.", "Cross-site scripting and SQL injection, because these traditional web application threats apply with equal weight to any application that uses Claude in any way.", "Prompt injection, data leakage from prompts or context, jailbreak attempts, and unsafe model output that bypasses application controls."], "a": 3, "e": "Option C correctly identifies threat categories introduced or significantly amplified by LLMbased application architecture. Prompt injection attempts to manipulate Claude into following adversarial instructions. Jailbreaks seek to circumvent behavioral or application safeguards. Data leakage can expose confidential information contained in system prompts, retrieved context, tool results, or conversation state. Unsafe model output becomes particularly serious when output is consumed by downstream systems or translated into tool actions. Anthropic's official guardrail documentation explicitly distinguishes jailbreaks and direct prompt injection from indirect prompt injection. It recommends input screening, hardened system prompts, structured handling of untrusted tool content, least-privilege access, output screening, and continuous monitoring. Anthropic also warns that sensitive prompt/context data can leak and recommends post-processing and output filtering where required. Traditional threats such as SQL injection or XSS remain relevant to the surrounding application, but they are not the additional AI-specific categories requested. B similarly describes conventional infrastructure threats. D is far too narrow because the SDK is only one component of the attack surface. The supplied exam source explicitly marks C. Relevant topics: Claude App Design, threat modeling, prompt injection, jailbreaks, data leakage, output safety, least privilege, and defense in depth."}, {"id": 91, "q": "You are building a Claude application that needs to maintain a persistent connection to a service that streams real-time updates. The team is unsure what communication pattern to use. Which communication pattern would you use?", "c": ["A WebSocket, because WebSockets are designed for bidirectional, persistent, real-time communication between the client and the streaming service.", "File-based communication where the service writes new updates to disk and the application polls the file system for changes.", "A single long HTTP request the server holds open indefinitely, with no standard WebSocket framing on the connection.", "Repeated short-lived HTTP polling requests, where the application opens a new HTTP connection each time it checks for updates."], "a": 0, "e": "Option B is the appropriate software-engineering communication pattern when the application requires a persistent, low-latency, bidirectional channel. WebSockets establish a connection using an HTTP Upgrade handshake and then maintain a TCP-based communication channel in which either side can send messages independently. This eliminates the repeated connection setup and request overhead associated with conventional polling. RFC 6455 defines WebSocket specifically as a protocol enabling two-way communication and explains that it provides a single TCP connection as an alternative to HTTP polling for interactive communication. Option A can work for infrequent updates, but repeatedly opening HTTP requests adds latency, headers, and server/client overhead and is unsuitable when continuous real-time communication is the stated requirement. C resembles long polling or an ad-hoc streaming connection but lacks the standardized framing, lifecycle behavior, and interoperability provided by WebSocket. D introduces filesystem polling and is not an appropriate network-streaming architecture. The important certification principle is selecting a communication mechanism based on application requirements rather than merely choosing an available protocol. For persistent two-way streaming, WebSocket provides the intended abstraction. Relevant Claude Developer topics are software engineering foundations, client-server communication, persistent connections, HTTP versus WebSocket patterns, streaming, and real-time application architecture."}, {"id": 92, "q": "You are establishing the guardrail strategy for a Claude application. The team wants to ensure guardrail failure does not expose the application to unsafe behavior. The guardrail strategy would…", "c": ["Implement a single comprehensive system prompt guardrail and validate its coverage against the application's full range of expected inputs.", "Layer multiple guardrails so a single guardrail failure does not expose the application to unsafe behavior.", "Apply guardrails at the application output level only and route flagged responses to a human reviewer before they are delivered to the user.", "Apply guardrails at the model level only and rely on the model's built-in safety behaviors to handle any cases the guardrail does not explicitly cover."], "a": 1, "e": "Option A is correct because the safest guardrail architecture is defense in depth, not dependence on one control. Anthropic's guardrail guidance explicitly recommends combining multiple safeguards: input screening and validation, hardened system instructions, safe handling of untrusted tool content, least-privilege permissions, output screening, monitoring, and red-team testing. The important engineering property is independence: if one layer misses an attack or unsafe request, another layer can still prevent harmful behavior or block delivery. Option B places control only at the output boundary. Human review can be useful for highrisk cases, but it does not protect tool execution, data access, prompt injection, or other failures that can occur before final output. Option C relies on a single system-prompt control; system instructions are probabilistic and cannot provide complete enforcement against adversarial or malformed inputs. Option D is weaker still because model-level safety alone does not enforce application-specific policies. Therefore, A best matches Claude Developer security guidance: layer preventive, detective, and enforcement controls so there is no single guardrail whose failure exposes the application. Relevant Study Guide topics: guardrails, prompt injection, input validation, output screening, least privilege, defense in depth, and production monitoring."}, {"id": 93, "q": "You are designing a Claude application that will process customer support tickets in two stages: a triage stage that classifies tickets and a response stage that drafts replies. The team is debating whether to use a single Claude call that handles both stages or separate Claude calls for each stage. How would you structure the application?", "c": ["Use multiple Claude calls in parallel that each draft a complete ticket reply, then have a fourth Claude call select the best one to send to the customer.", "Use a single Claude call for both stages, on the grounds that a single call is cheaper than multiple calls in any production Claude application setup.", "Use a single Claude call for triage and then use a non-Claude rule-based system for response generation, on the grounds that rule-based systems are more reliable for drafting replies.", "Use separate Claude calls for triage and response, because each stage has distinct inputs, outputs, and success criteria that benefit from focused prompts."], "a": 3, "e": "Option C follows a prompt-chaining/workflow decomposition pattern. Ticket classification and reply generation are materially different tasks. Triage may require a constrained category, priority, or routing decision, while response generation requires richer context, tone, policy compliance, and customer-facing language. Splitting the stages allows each Claude call to use a prompt, context set, model configuration, output format, and evaluation criterion appropriate to that specific responsibility. Anthropic's guidance on effective agentic systems distinguishes predictable workflows from open-ended agents and recommends using the simplest architecture that meets requirements. Predefined workflows are particularly appropriate where work can be divided into clear processing stages. This decomposition also creates useful engineering boundaries: the triage output can be validated before becoming input to the drafting stage; triage accuracy and response quality can be evaluated independently; and either stage can later be optimized without rewriting the entire process. A unnecessarily restricts the second stage to rules. B introduces expensive parallel generation and a selection step without a stated requirement. D optimizes solely for call count while sacrificing task separation and observability. The supplied exam source marks C. Relevant topics: Agent Patterns, prompt chaining, workflow decomposition, focused prompts, stage-level evaluation, and modular Claude application design."}, {"id": 94, "q": "You are integrating Claude into an application written in Python. The Claude SDK provides a Python client that wraps the underlying REST API. How would you integrate the SDK?", "c": ["Use the Claude Python SDK and let it handle authentication, retries, and response parsing through its standard documented patterns for Python integrations.", "Call the REST API directly with raw HTTP requests so the application avoids the SDK's abstraction between the application code and the API.", "Use a different LLM provider's SDK and translate the responses into Claude's API shape so the application can switch providers in the future.", "Skip the SDK and embed Claude calls in shell commands invoked from Python, so that the application runs the calls outside the main Python process."], "a": 0, "e": "Option B is correct because the official Anthropic Python SDK is the supported abstraction for calling the Claude REST API from Python. Anthropic documents both synchronous and asynchronous clients, standardized request/response objects, streaming support, error classes, timeouts, request IDs, and built-in retry behavior for common transient failures. Using those documented primitives reduces boilerplate and keeps integration behavior aligned with the API. Option A is technically possible, but it unnecessarily reimplements authentication headers, serialization, error mapping, retries, timeouts, and response handling that the SDK already provides. Direct HTTP is appropriate only when there is a specific reason not to use the supported client. Option C introduces another provider's abstraction and a translation layer that is unrelated to the stated requirement and increases compatibility risk. Option D invokes shell commands from Python, creating needless process-management, security, and error- handling complexity. The correct engineering principle is to use the highest-level supported client that satisfies the application's requirements while retaining access to lower-level HTTP controls when genuinely needed. Therefore, B is the appropriate Claude integration pattern. Relevant Study Guide topics: Python SDK, REST abstraction, authentication, retries, exceptions, response parsing, synchronous/asynchronous clients, and maintainable API integration."}, {"id": 95, "q": "Your agent makes 10 to 15 tool calls per task, and you have noticed it sometimes loses track of earlier results by the time it reaches later steps. The agent's context window is large enough to hold all the messages, but the relevant information appears to get buried as the conversation grows. How would you address this?", "c": ["Switch to a different agentic framework that advertises automatic context-window management as a built-in feature.", "Apply a context-management pattern that summarizes or prunes older tool outputs while preserving the active task state.", "Reduce the number of tool calls per task by combining several existing tools into larger, multi-purpose tools.", "Increase the context window further so all tool outputs from every prior step remain in full detail throughout the task."], "a": 1, "e": "Option D is correct because the problem is not insufficient nominal context capacity; it is degraded signal quality as the working context grows. Anthropic's context-window guidance explicitly states that more context is not automatically better. As conversations expand, recall and accuracy can degrade through \"context rot,\" so long-running agents need active context management rather than simply retaining every prior tool result. A good pattern preserves the active task state while compacting, summarizing, or pruning stale intermediate outputs. Anthropic documents server-side compaction for long-running conversations and context-editing /pruning approaches that clear old tool results when they no longer contribute useful information. This keeps high-value constraints and conclusions visible without carrying every verbose response forward. Option A changes frameworks without fixing the architectural cause. Option B may reduce call count but also creates larger multi-purpose tools and does not guarantee better context quality. Option C increases capacity while preserving the same low-signal accumulation, so the relevant facts can remain buried. Therefore, D best implements context engineering for agentic workloads. Relevant Study Guide topics: context engineering, context rot, compaction, tool-result pruning, long-running agents, state preservation, and context-window optimization."}, {"id": 96, "q": "Your Claude application's prompt was written months ago and has not been updated. The team has discovered through evals that the prompt produces good results on common cases but underperforms on a specific category of inputs that has grown in volume. How would you respond?", "c": ["Iterate on the prompt to address the underperforming category, validate the change with evals, and continue refining as needed.", "Add the underperforming category to a separate Claude application with its own prompt so the original prompt does not change.", "Replace the prompt with a new one aligned to the underperforming category, treating any common-case performance change as a known tradeoff.", "Tell users to avoid the underperforming category by adding warnings in the application's user interface about handled inputs."], "a": 0, "e": "The correct response is iterative prompt improvement backed by evaluation , making A the appropriate choice. The supplied Claude Certified Developer Foundations material explicitly selects A. When production input distribution changes, a prompt that previously met requirements can become inadequate. The correct engineering response is not to preserve the prompt merely because it once worked; prompts are application components that should evolve with observed workload behavior. Anthropic's official evaluation guidance describes prompt development as a cycle involving test cases, an initial prompt, iterative testing and refinement, final validation, and deployment. Success criteria should be specific and measurable, and evaluations should include representative cases that expose known failure modes. The underperforming category should therefore be incorporated into the evaluation set. The team can modify instructions, examples, context organization, or other prompt components, then compare the revised prompt against both the newly important category and existing common cases. This prevents improvement in one segment from silently producing regressions elsewhere. B avoids the defect instead of correcting it. C risks degrading previously successful behavior. D creates unnecessary architectural fragmentation."}, {"id": 97, "q": "Your team is preparing to roll out a configuration change that updates several prompt versions across a Claude application used by multiple downstream systems. The change has already been tested in staging, but the team has not assessed how the prompt change will affect each downstream system that depends on the application's output. What would you do before rolling out the change?", "c": ["Assess the configuration impact on each downstream system before rolling out, and coordinate with downstream system owners as needed.", "Document the prompt version changes in the application changelog and proceed with the rollout, treating the staging test results as sufficient evidence of impact across all downstream systems.", "Limit the rollout to systems that were explicitly included in staging testing, and defer all other downstream systems until a later release cycle.", "Notify downstream system owners that a change is coming and schedule the rollout for the following week, without conducting a formal impact assessment."], "a": 0, "e": "A is the appropriate configuration-change control. The supplied examination item selects A . A prompt is not merely editorial text; in a Claude application it functions as executable behavioral configuration. Changing a prompt can alter output structure, field population, language, classifications, tool-use decisions, refusal behavior, or other assumptions on which downstream consumers depend. Staging success therefore proves only the scenarios actually covered by staging. Before production rollout, the team must perform impact analysis across every dependent system, identify contractual expectations, run representative regressions, and coordinate changes where a consumer may be affected. This is especially important where downstream applications parse structured output or expect stable semantics. Anthropic's Structured Outputs guidance illustrates why interface contracts matter: missing fields, inconsistent types, and schema violations can break consuming applications. Even when output remains syntactically valid, prompt changes can produce semantic changes that require consumer validation. B assumes staging coverage is universal. C communicates the change without determining its consequences. D arbitrarily defers systems instead of assessing them."}];

if(cfg.count>all.length||(cfg.count!==0&&!COUNTS.includes(cfg.count)))cfg.count=40;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));window.scrollTo(0,0)}
function nQ(){return cfg.count===0?all.length:Math.min(cfg.count,all.length)}
function saveCfg(){try{localStorage.setItem('ccdvf_cfg',JSON.stringify(cfg))}catch(e){}}

function renderHome(){
  $('countOpts').innerHTML=COUNTS.map(c=>`<button class="chip ${cfg.count===c?'sel':''}" onclick="setCount(${c})">${c===0?'All ('+all.length+')':c}</button>`).join('');
  $('timerOpts').innerHTML=[true,false].map(t=>`<button class="chip ${cfg.timed===t?'sel':''}" onclick="setTimed(${t})">${t?'Timed':'No timer'}</button>`).join('');
  $('sQ').textContent=nQ();$('sT').textContent=cfg.timed?Math.ceil(nQ()*MIN_PER_Q):'∞';$('sP').textContent=PASS_PCT+'%';
  const h=getHistory().slice(0,3);
  $('miniHist').innerHTML=h.length?'<label class="lbl">Recent attempts</label>'+h.map(x=>`<div class="hist-item"><span>${new Date(x.date).toLocaleString()}</span><span class="${x.passed?'pass':'fail'}">${x.pct}% (${x.correct}/${x.total})</span></div>`).join(''):'';
}
function setCount(c){cfg.count=c;saveCfg();renderHome()}
function setTimed(t){cfg.timed=t;saveCfg();renderHome()}
function goHome(){clearInterval(timerInterval);renderHome();showScreen('home')}

function startQuiz(){
  questions=shuffle(all).slice(0,nQ()).map(q=>{
    const order=shuffle(q.c.map((_,i)=>i));
    return {id:q.id,q:q.q,e:q.e,c:order.map(i=>q.c[i]),a:order.indexOf(q.a)};
  });
  current=0;answers=new Array(questions.length).fill(null);
  totalTime=Math.ceil(questions.length*MIN_PER_Q)*60;secondsLeft=totalTime;startTime=Date.now();
  clearInterval(timerInterval);
  $('timer').style.display=cfg.timed?'':'none';
  if(cfg.timed){updateTimer();timerInterval=setInterval(()=>{secondsLeft--;updateTimer();if(secondsLeft<=0)finishQuiz(true)},1000)}
  showScreen('quiz');renderQuestion();
}
function updateTimer(){const t=$('timer');t.textContent=fmt(secondsLeft);t.className='timer'+(secondsLeft<=300?' danger':secondsLeft<=600?' warning':'')}

function renderQuestion(){
  if(document.activeElement)document.activeElement.blur();
  const q=questions[current];
  $('qCount').textContent=`Question ${current+1} / ${questions.length}`;
  $('prog').style.width=(current/questions.length*100)+'%';
  $('qText').textContent=q.q;
  $('choices').innerHTML=q.c.map((c,i)=>`<button class="choice" data-i="${i}" onclick="selectChoice(${i})"><span class="k">${KEYS[i]}</span><span>${esc(c)}</span></button>`).join('');
  $('fb').className='fb';$('fb').innerHTML='';
  const last=current===questions.length-1;
  $('skipBtn').textContent=last?'Finish →':'Skip →';$('skipBtn').disabled=false;
  $('nextBtn').textContent=last?'See results →':'Next question →';$('nextBtn').disabled=true;
  window.scrollTo(0,0);
}
function selectChoice(i){
  if(answers[current]!==null)return;
  answers[current]=i;const q=questions[current];
  document.querySelectorAll('.choice').forEach((b,k)=>{
    b.classList.add('locked');
    if(k===q.a)b.classList.add('correct');
    else if(k===i)b.classList.add('wrong');
  });
  const ok=i===q.a;
  $('fb').className='fb show '+(ok?'ok':'no');
  $('fb').innerHTML=`<h3>${ok?'✓ Correct!':'✗ Incorrect — correct answer: '+KEYS[q.a]}</h3><p>${esc(q.e)}</p><p class="note">ℹ Option letters inside this explanation come from the original dump and may not match the shuffled letters above.</p>`;
  $('nextBtn').disabled=false;$('skipBtn').disabled=true;
}
function nextQuestion(){if(current>=questions.length-1)return finishQuiz(false);current++;renderQuestion()}
function skipQuestion(){if(current>=questions.length-1)return finishQuiz(false);current++;renderQuestion()}

function finishQuiz(timedOut){
  clearInterval(timerInterval);
  const used=Math.min(Math.round((Date.now()-startTime)/1000),cfg.timed?totalTime:1e9);
  const correct=answers.filter((a,i)=>a===questions[i].a).length;
  const skipped=answers.filter(a=>a===null).length;
  const total=questions.length,pct=Math.round(correct/total*100),passed=pct>=PASS_PCT;
  $('rTitle').textContent=timedOut?"Time's up!":(passed?'🎉 Passed!':'Result');
  $('rMsg').textContent=passed?'Well done! You passed!':'Not quite — keep studying. Pass mark is '+PASS_PCT+'%.';
  $('ring').style.setProperty('--p',pct);$('ring').style.setProperty('--c',passed?'var(--success)':'var(--danger)');
  $('rPct').textContent=pct+'%';$('rC').textContent=correct;
  $('rW').textContent=total-correct-skipped;$('rWl').textContent='Wrong'+(skipped?` (+${skipped} skipped)`:'');
  $('rT').textContent=fmt(used);
  saveHistory({date:Date.now(),pct,correct,total,used,passed});
  showScreen('results');
}

function showReview(f){reviewFilter=f==='wrong'?'wrong':f;setFilter(reviewFilter);showScreen('review')}
function setFilter(f){reviewFilter=f;document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('sel',b.dataset.f===f));renderReview()}
function renderReview(){
  const out=questions.map((q,i)=>{
    const a=answers[i],ok=a===q.a;
    if(reviewFilter==='wrong'&&ok)return'';if(reviewFilter==='right'&&!ok)return'';
    return `<div class="rv ${ok?'ok':'no'}"><div class="muted">#${i+1}${a===null?' · Skipped':''}</div><div class="qtext">${esc(q.q)}</div>`+
      q.c.map((c,k)=>`<div class="rvc ${k===q.a?'c':k===a?'w':''}"><b>${KEYS[k]}.</b><span>${esc(c)}</span>${k===q.a?'<span class="tag pass">Correct</span>':k===a?'<span class="tag fail">Your answer</span>':''}</div>`).join('')+
      `<div class="expl">${esc(q.e)}<div class="note">ℹ Letters in the explanation refer to the original dump order.</div></div></div>`;
  }).join('');
  $('rvList').innerHTML=out||'<p class="muted">Nothing to show for this filter.</p>';
}

function getHistory(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return[]}}
function saveHistory(r){try{localStorage.setItem(STORAGE_KEY,JSON.stringify([r,...getHistory()].slice(0,20)))}catch(e){}}
function showHistory(){
  const h=getHistory();
  $('histList').innerHTML=h.length?h.map(x=>`<div class="hrow"><div class="hist-item" style="padding:0"><span>${new Date(x.date).toLocaleString()}</span><b class="${x.passed?'pass':'fail'}">${x.pct}% · ${x.passed?'Passed':'Failed'}</b></div><div class="muted">${x.correct}/${x.total} correct · ${fmt(x.used)}</div><div class="bar"><i style="width:${x.pct}%;background:var(${x.passed?'--success':'--danger'})"></i></div></div>`).join(''):'<p class="muted">No attempts yet.</p>';
  showScreen('history');
}
function clearHistory(){if(confirm('Delete all saved history?')){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}renderHome();if($('history').classList.contains('active'))showHistory()}}

document.addEventListener('keydown',e=>{
  if(!$('quiz').classList.contains('active'))return;
  const k=e.key.toUpperCase(),idx=KEYS.indexOf(k),n=parseInt(e.key)-1;
  const i=idx>=0&&idx<questions[current].c.length?idx:(n>=0&&n<questions[current].c.length?n:-1);
  if(i>=0)selectChoice(i);
  else if((e.key==='Enter'||e.key==='ArrowRight')&&answers[current]!==null){e.preventDefault();nextQuestion()}
});
renderHome();
</script>
</body>
</html>
