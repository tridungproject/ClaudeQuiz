<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCDV-F Practice Exam</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3250;--accent:#d97757;--accent2:#f0a98c;--success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--text:#e8eaf6;--text-muted:#8892b0;--text-dim:#4a5280}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;min-height:100vh}
button{font:inherit;cursor:pointer;border:none;color:inherit}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.center{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:560px}
.badge{display:inline-block;background:var(--surface2);color:var(--accent2);border:1px solid var(--border);border-radius:99px;padding:4px 12px;font-size:12px;letter-spacing:.05em;margin-bottom:14px}
h1{font-size:26px;margin-bottom:6px}h2{font-size:20px}
.muted{color:var(--text-muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stat{background:var(--surface2);border-radius:12px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--accent2)}.stat span{font-size:12px;color:var(--text-muted)}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:14px;color:var(--text-muted)}
.chip.sel{border-color:var(--accent);color:var(--text);background:rgba(217,119,87,.15)}
label.lbl{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
.btn{padding:12px 20px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btns .primary{flex:1 1 100%}
.hist-mini{margin-top:22px;border-top:1px solid var(--border);padding-top:14px}
.hist-item{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--text-muted)}
.pass{color:var(--success)}.fail{color:var(--danger)}
/* quiz */
.qhead{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px}
.qhead-in{max-width:760px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.qcount{font-size:14px;color:var(--text-muted);white-space:nowrap}
.progress{flex:1;min-width:120px;height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.timer{background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:4px 14px;font-variant-numeric:tabular-nums;font-weight:700}
.timer.warning{color:var(--warning);border-color:var(--warning)}
.timer.danger{color:var(--danger);border-color:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.qbody{max-width:760px;margin:auto;padding:24px 16px 120px}
.qtext{font-size:18px;margin-bottom:20px;font-weight:500}
.choice{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:15px;transition:.15s}
.choice:hover:not(.locked){border-color:var(--accent)}
.choice .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--accent2)}
.choice.correct{border-color:var(--success);background:rgba(34,197,94,.1)}
.choice.correct .k{background:var(--success);color:#fff}
.choice.wrong{border-color:var(--danger);background:rgba(239,68,68,.1)}
.choice.wrong .k{background:var(--danger);color:#fff}
.choice.locked{cursor:default}
.fb{margin-top:16px;border-radius:12px;padding:16px;font-size:14px;display:none;border:1px solid var(--border);background:var(--surface)}
.fb.show{display:block}
.fb h3{font-size:15px;margin-bottom:6px}
.fb.ok h3{color:var(--success)}.fb.no h3{color:var(--danger)}
.fb p{color:var(--text-muted)}.note{font-size:12px;color:var(--text-dim);margin-top:8px}
.qfoot{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 16px}
.qfoot-in{max-width:760px;margin:auto;display:flex;justify-content:space-between;gap:10px}
/* results */
.ring{width:150px;height:150px;border-radius:50%;margin:18px auto;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface2) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:32px;font-weight:800}
.center-t{text-align:center}
.stats.two{grid-template-columns:repeat(3,1fr)}
/* review */
.wrap{max-width:760px;margin:auto;padding:20px 16px 60px}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.rv{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.rv.ok{border-left-color:var(--success)}.rv.no{border-left-color:var(--danger)}
.rv .qtext{font-size:16px}
.rvc{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:14px;margin-bottom:5px;background:var(--surface2)}
.rvc.c{background:rgba(34,197,94,.12)}.rvc.w{background:rgba(239,68,68,.12)}
.tag{margin-left:auto;flex:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface)}
.expl{font-size:13px;color:var(--text-muted);margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.hrow{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.hrow .bar{height:6px;border-radius:9px;background:var(--surface2);margin-top:8px;overflow:hidden}.hrow .bar i{display:block;height:100%}
@media(max-width:520px){.card{padding:22px}.stats{gap:6px}.qtext{font-size:16px}}
</style>
</head>
<body>

<div id="home" class="screen active center">
  <div class="card">
    <span class="badge">CCDV-F · Claude Certified Developer – Foundations</span>
    <h1>Practice Exam</h1>
    <p class="muted">Answers are revealed immediately with explanations. Question and answer order is shuffled every attempt.</p>
    <div class="stats">
      <div class="stat"><b id="sQ">40</b><span>Questions</span></div>
      <div class="stat"><b id="sT">60</b><span>Minutes</span></div>
      <div class="stat"><b id="sP">70%</b><span>Pass mark</span></div>
    </div>
    <label class="lbl">Number of questions</label>
    <div class="opt-row" id="countOpts"></div>
    <label class="lbl">Timer</label>
    <div class="opt-row" id="timerOpts"></div>
    <div class="btns">
      <button class="btn primary" onclick="startQuiz()">▶ Start Quiz</button>
      <button class="btn" onclick="showHistory()">📊 View History</button>
      <button class="btn" onclick="clearHistory()">🗑 Clear</button>
    </div>
    <div class="hist-mini" id="miniHist"></div>
  </div>
</div>

<div id="quiz" class="screen">
  <div class="qhead"><div class="qhead-in">
    <span class="qcount" id="qCount"></span>
    <div class="progress"><i id="prog"></i></div>
    <span class="timer" id="timer">60:00</span>
  </div></div>
  <div class="qbody">
    <div class="qtext" id="qText"></div>
    <div id="choices"></div>
    <div class="fb" id="fb"></div>
  </div>
  <div class="qfoot"><div class="qfoot-in">
    <button class="btn" id="skipBtn" onclick="skipQuestion()">Skip →</button>
    <button class="btn primary" id="nextBtn" onclick="nextQuestion()" disabled>Next question →</button>
  </div></div>
</div>

<div id="results" class="screen center">
  <div class="card center-t">
    <h1 id="rTitle"></h1>
    <p class="muted" id="rMsg"></p>
    <div class="ring" id="ring"><div id="rPct"></div></div>
    <div class="stats">
      <div class="stat"><b class="pass" id="rC">0</b><span>Correct</span></div>
      <div class="stat"><b class="fail" id="rW">0</b><span id="rWl">Wrong</span></div>
      <div class="stat"><b id="rT">0:00</b><span>Time used</span></div>
    </div>
    <div class="btns">
      <button class="btn" onclick="showReview('wrong')">🔍 Review incorrect answers</button>
      <button class="btn" onclick="showReview('all')">📄 Review all questions</button>
      <button class="btn primary" onclick="startQuiz()">🔄 Retake quiz</button>
      <button class="btn" onclick="goHome()">🏠 Back to home</button>
    </div>
  </div>
</div>

<div id="review" class="screen"><div class="wrap">
  <div class="topbar">
    <button class="btn" onclick="showScreen('results')">← Back</button>
    <button class="chip" data-f="all" onclick="setFilter('all')">All</button>
    <button class="chip" data-f="wrong" onclick="setFilter('wrong')">Incorrect</button>
    <button class="chip" data-f="right" onclick="setFilter('right')">Correct</button>
  </div>
  <div id="rvList"></div>
</div></div>

<div id="history" class="screen"><div class="wrap">
  <div class="topbar"><button class="btn" onclick="goHome()">← Back</button><h2>History</h2></div>
  <div id="histList"></div>
</div></div>

<script>
window.__QUESTIONS__ = [{"id": 1, "q": "A teammate has asked you to explain the difference between context engineering and prompt engineering. They have heard the terms used interchangeably and are unsure how each applies to a Claude application that processes long-running multi-step tasks. How would you describe the distinction?", "c": ["Prompt engineering and context engineering each address content the team gives Claude, but the team can group them under a single workflow because the practices use overlapping techniques.", "Prompt engineering focuses on the model's response, while context engineering focuses on the user's input across many sessions in a long-running multi-step Claude application.", "Prompt engineering is the older term for prompt design, while context engineering is the newer term that has replaced it in modern Claude applications across the industry.", "Prompt engineering shapes individual prompts for specific outputs, while context engineering manages how content flows across turns and steps and takes steps to keep relevant state visible."], "a": 3, "e": "Option C accurately captures Anthropic's distinction. Prompt engineering primarily concerns how instructions are written, structured, and organized to obtain the desired behavior from a particular model invocation. Techniques include explicit instructions, examples, roles, XML structure, output requirements, and task- specific prompt construction. Context engineering operates at a broader architectural level: it determines which information should actually be present in the model's context at each inference step. Anthropic defines prompt engineering as methods for writing and organizing LLM instructions, whereas context engineering encompasses strategies for curating and maintaining the optimal set of tokens during inference. For long-running agents, context can contain system instructions, tools, MCP resources, retrieved documents, prior messages, tool results, summaries, and memory. This distinction matters because multi-step agents continuously generate new state. Effective systems may prune obsolete results, retrieve information just in time, compact earlier conversation history, isolate subagent contexts, or store persistent state externally. B is incorrect because context engineering has not simply replaced prompt engineering; the two operate at different scopes. A defines context too narrowly, and D obscures an important architectural distinction. Therefore, C correctly represents Claude Developer coverage of prompt engineering versus context engineering, context curation, agent state, long-horizon workflows, and contextwindow optimization."}, {"id": 2, "q": "You are starting a new Claude application and have a small set of well-labeled examples that demonstrate the desired output format. You want to use these examples to guide Claude's behavior. How would you guide the application's behavior?", "c": ["Use zero-shot prompting and rely on the model's general capability to produce the desired output format consistently across all incoming requests.", "Embed the examples in a database and retrieve them at runtime as reference material for the team.", "Train a custom model on the labeled examples before deployment so that the application does not need to include the examples in any prompt during operation.", "Use multi-shot prompting by including the labeled examples in the prompt so Claude can match the desired output format on each request."], "a": 3, "e": "The supplied examination set identifies A as correct. A small collection of high-quality labeled examples is ideally suited to few-shot or multishot prompting . The examples demonstrate concretely what acceptable input/output behavior looks like, allowing Claude to infer formatting, structure, tone, and task-specific conventions without requiring model retraining. Anthropic's official prompting guidance states that examples are among the most reliable ways to steer Claude's output format, tone, and structure. It recommends using relevant, diverse examples and clearly separating them from the surrounding instructions. Anthropic currently recommends approximately three to five examples where practical and suggests XML structures such as <examples> and <example> to make prompt organization explicit. B discards useful supervision by relying exclusively on zero-shot behavior. C is unnecessary for a small fixed set and does not ensure those examples are actually visible to Claude unless additional retrieval logic is created. D introduces unnecessary training complexity for a behavior that prompting already addresses efficiently. Therefore, A provides the lowest-complexity, highest-leverage solution."}, {"id": 3, "q": "Your Claude application has multi-step workflows where each step's output is needed only briefly before the agent moves on. The cumulative tool output is filling the context window with content that is no longer relevant. How would you handle the accumulating tool output?", "c": ["Apply prompt caching to the accumulated tool outputs so the application does not re-pay for the older content on each subsequent step.", "Keep every tool output in the context indefinitely so the agent has the full record of every step it has executed during the workflow.", "Switch to a smaller Claude model that processes context more efficiently and treat any quality loss as a tradeoff for the cost reduction.", "Apply tool output pruning to remove tool outputs that are no longer needed by later steps in the workflow."], "a": 3, "e": "Option A applies the correct context-engineering strategy: remove stale tool results once they no longer contribute useful information to subsequent reasoning. Agentic workflows frequently accumulate search results, file contents, API responses, and intermediate artifacts. Keeping all of them indefinitely consumes the finite context window, raises token cost, and can reduce model focus by introducing low-value information. Anthropic specifically documents tool result clearing for this situation. Context Editing can remove older tool results when the conversation grows, while preserving recent interactions and optionally retaining tools whose results must remain available. Anthropic describes old tool outputs such as retrieved files or search results as candidates for clearing after Claude has processed them. Prompt caching in B solves a different problem: it can lower cost and latency for repeated static prompt prefixes, but cached tokens still constitute context and therefore do not eliminate context-window pressure. C changes model capability without solving the architectural cause. D maximizes context pollution. The correct architecture is therefore to preserve high-signal state while pruning ephemeral intermediate outputs. This aligns with Claude Developer coverage of context engineering, long-running agents, context- window management, tool-result clearing, and efficient agent state management. Anthropic's broader context- engineering guidance likewise emphasizes curating the smallest high-signal context necessary for successful inference."}, {"id": 4, "q": "Your Claude application's API keys are stored in a secrets manager. The team is debating whether the same key should be used in development, staging, and production environments. How would you handle the keys across environments?", "c": ["Rotate the same key across environments at random intervals on the grounds that random rotation provides isolation between environments without requiring distinct keys.", "Use the same key across all environments for simplicity and treat the propagation of any compromise as a known operational tradeoff for the team's key management approach.", "Use distinct keys for each environment so a compromise in one environment does not affect the others during normal operation across the application's lifecycle.", "Use a single development key everywhere on the grounds that production keys are too risky to deploy across the application's three environments during normal operation."], "a": 2, "e": "Option A provides proper environment isolation and credential blast-radius control. Development, staging, and production represent different trust boundaries and should not share the same API credential. If a development machine, CI job, or staging service is compromised, a distinct credential prevents the attacker from automatically gaining the same access to production. Anthropic's official workspace documentation explicitly recommends using separate workspaces for development, staging, and production. Workspaces can have their own API keys, members, resource limits, and usage tracking, and keys can be scoped to a specific workspace. Anthropic's authentication guidance also instructs developers to store API keys in a secrets manager, rotate them periodically, revoke suspected compromised keys, and use workspaces to scope credentials by project or environment. B confuses rotation with isolation: rotating a credential that remains shared across all environments does not create independent security boundaries. C deliberately increases blast radius. D merely substitutes one globally shared key for another and therefore has the same architectural flaw. The supplied exam source marks A as correct. Relevant topics: Confia Management, secrets management, API-key scoping, environment isolation, credential rotation, workspaces, least privilege, and production security."}, {"id": 5, "q": "A teammate has asked how to extend Claude Code with a custom Skill that the team can invoke during sessions. The Skill consists of a set of instructions and a few support scripts the team wants Claude to be able to call when the Skill is loaded. Where is the right place to define the Skill?", "c": ["Define the Skill in a Skills directory recognized by Claude Code, where Claude can discover and load it during sessions for the team's repositories.", "Define the Skill inside the application's source code as a regular library module and call it from the application code instead of from Claude Code.", "Define the Skill in a personal scratch directory on each developer's machine and load it manually before each Claude Code session that needs it.", "Define the Skill as a long inline instruction at the top of every CLAUDE.md file in the team's repositories so Claude has access to it on every session."], "a": 0, "e": "Option C matches Claude Code's documented Skill architecture. Agent Skills are filesystembased extension artifacts rather than ordinary application modules or repeated prompt fragments. A Skill is represented by a directory containing a required SKILL.md file and can include optional supporting scripts, templates, examples, and reference material. Anthropic documents project Skills under .claude/skills/ <skill-name> /SKILL.md. Projectlevel Skills can be shared through Git and automatically discovered when Claude Code loads project settings. Supporting scripts can reside alongside the Skill and be referenced from SKILL.md. A incorrectly embeds reusable procedural material into every CLAUDE.md file, creating duplication and loading instructions even when they are irrelevant. B creates a conventional source-code library but does not register a Claude Code Skill. D makes the capability dependent on undocumented, developer-specific setup and undermines team reuse. Therefore, C uses the extension mechanism specifically designed for discoverable, reusable Claude capabilities. Relevant Study Guide topics: Agent Skills, .claude/skills, SKILL.md, supporting resources, filesystem discovery, project-level configuration, and reusable Claude Code capabilities."}, {"id": 6, "q": "You are configuring Claude Code for a new project. The team needs to set permissions, default model selections, and environment-specific behavior at the project level so the configuration is consistent across all developers working on the repository. The Claude Code mechanism you would use is...", "c": ["The settings.json file, scoped at the project level so the configuration applies consistently across developers and persists with the repository.", "A shared spreadsheet that lists configuration values for team members to reference and update by hand as the project evolves.", "A system prompt embedded in every Claude Code conversation by each developer at the start of every session in the project.", "Environment variables that each developer sets on their own machine when working with Claude Code on the project."], "a": 0, "e": "D is directly aligned with Claude Code's configuration model. The supplied exam source marks D . Anthropic documents settings.json as the official mechanism for configuring Claude Code through hierarchical scopes. Shared project configuration is stored in .claude/settings.json , which is intended to be checked into source control and shared with the team. Project settings provide consistent repository-level behavior while still participating in Claude Code's configuration precedence. They can configure permissions, environment variables, tool behavior, and other supported project policies. Claude Code additionally distinguishes shared project settings from .claude /settings.local.json, which is intentionally excluded from source control and is suitable for developer-specific experimentation or machine-local overrides. A spreadsheet provides documentation but no executable configuration enforcement. B allows every developer's configuration to diverge and is appropriate only for values that genuinely belong to the local environment. C requires manual repetition and cannot reliably establish repository-wide policy. Therefore, shared project settings.json is the appropriate configuration-as-code mechanism."}, {"id": 7, "q": "You are designing an agent that handles a multi-step research task. You want the agent to break the task into smaller pieces, hand each piece to a focused subagent, and consolidate the results. The agent pattern you would apply is…", "c": ["A single tool-use loop that includes every tool the agent might need across all subtasks.", "An orchestrator and subagent pattern with specialized subagents assigned to each subtask.", "A memory pattern that stores the entire research history in advance, before any subtask begins execution.", "A context-window pruning pattern that drops each subtask's content after the agent moves on."], "a": 1, "e": "The supplied Claude Developer source explicitly marks A . The scenario contains the defining elements of an orchestrator/subagent architecture : decomposition of a larger objective, delegation of independent subtasks to specialized workers, and aggregation of their outputs by a coordinating agent. This architecture is appropriate when subtasks can be performed with focused context or specialized tools. Instead of forcing one agent to carry every intermediate detail, the orchestrator can formulate assignments, launch suitable subagents, receive condensed results, identify missing information, and synthesize the final research product. This also enables context isolation and potentially parallel execution. Anthropic's published multi-agent architecture uses this orchestrator-worker approach for research workloads: a lead agent decomposes a query, delegates work to specialized subagents, and then integrates their findings. This is particularly useful where exploration is broad and individual subtasks benefit from independent context windows. The broader model-selection guidance also identifies orchestrator strategies as useful where work can be partitioned among worker models. B describes storage rather than delegation. C is a context-management technique, not a decomposition pattern. D centralizes all responsibilities in a single loop."}, {"id": 8, "q": "Your team is debating how to manage the prompts used in your Claude application. Some prompts are checked into the code repository, some live in a separate configuration file, and some are constructed inline at runtime. The result is inconsistent, and a recent prompt change went out without code review. What steps would you take?", "c": ["Move all prompts out of version control to a separate spreadsheet that team members can edit freely as the application evolves over time.", "Establish a single source of truth for prompts but keep change review optional, allowing developers to update prompts directly when changes are urgent.", "Move all prompts to inline runtime construction so the team can update them quickly through a streamlined process outside the standard code review workflow.", "Establish a single source of truth for prompts, version-control them alongside code, and require code review for prompt changes."], "a": 3, "e": "Option D treats prompts as production configuration and executable application behavior rather than informal text. A prompt modification can change output format, tool-selection behavior, policy enforcement, downstream compatibility, token usage, or model quality just as materially as an ordinary source-code change. Consequently, prompt changes need traceability, review, testing, and rollback. A single source of truth prevents different application paths from silently using inconsistent prompt versions. Version control provides an immutable history showing who changed the prompt, what changed, and which application release used it. Pull-request review enables peer assessment and automated evaluation before deployment. The same configuration-as-code principle appears throughout Claude Code's project configuration model, where shared project configuration is designed to live with version-controlled project artifacts. A removes governance and creates an uncontrolled external state. B increases hidden runtime behavior and bypasses normal review. C solves fragmentation but leaves the exact governance failure described in the scenario-the ability to ship prompt changes without review. Therefore, D provides reproducibility and controlled change management. Relevant Study Guide topics: prompt versioning, configuration management, source control, change review, reproducibility, regression testing, and rollback."}, {"id": 9, "q": "A team has deployed a multi-agent system in which a primary agent decomposes user requests and delegates subtasks to three specialized subagents: one for data retrieval, one for analysis, and one for report generation. In production, the team observes that subagents are making redundant tool calls, occasionally exceeding token budgets, and sometimes producing outputs that contradict each other - all of which the primary agent passes along without catching. What is the most appropriate way to address these failures?", "c": ["Collapse the three subagents into a single large-context model call that handles retrieval, analysis, and generation in one pass.", "Add retry logic to each subagent so that when a tool call fails, the subagent retries automatically before escalating - and configure each subagent to log its tool calls and outputs to a shared trace so the team can audit redundancy and contradictions after the fact.", "Strengthen the primary agent's management layer to enforce per-subagent tool budgets, validate outputs against a defined schema before passing them forward, and establish explicit handoff contracts between stages.", "Give each subagent read access to the other subagents' outputs so they can identify and resolve contradictions without routing back through the primary agent."], "a": 2, "e": "C addresses the failures at the correct architectural layer: orchestration and supervision . The supplied exam item identifies C as correct. The primary agent is responsible not merely for forwarding subordinate output but for governing delegation, resource usage, stage boundaries, and result quality. Anthropic's current guidance recommends explicit control over subagent use because excessive delegation multiplies latency and cost. Its documentation specifically supports deterministic limits on subagent spawning and SDK budget controls such as max_budget_usd. Tool contracts can also use defined input schemas and strict validation so malformed data cannot silently propagate between processing stages. Explicit handoff contracts are equally important. Retrieval should provide an agreed structure to analysis; analysis should provide validated findings to report generation; and the manager should reject, retry, reconcile, or escalate outputs that violate those contracts. A improves observability but mainly detects problems after they occur. B destroys context isolation and can create additional coupling. D abandons useful specialization instead of correcting deficient supervision."}, {"id": 10, "q": "Your team is choosing how to add a capability to a Claude application. You want to apply the appropriate option, whether built-in tool, custom tool, Skill, or MCP server, based on the use case. You would choose the option that…", "c": ["Is the easiest to build given the team's current development tools and workflows.", "Is the newest available option among built-in tools, custom tools, Skills, and MCP servers.", "Is the most familiar to the team based on prior experience with similar capabilities.", "Matches the use case's scope, reuse needs, and integration context."], "a": 3, "e": "Option D reflects the correct architecture-selection principle: extension mechanisms should be selected according to what the capability must accomplish rather than familiarity, novelty, or implementation convenience. Anthropic explicitly distinguishes Claude extension mechanisms by purpose. Built-in tools cover common capabilities already supported by the platform. Custom tools expose application-specific callable operations through defined schemas. Skills package reusable knowledge, instructions, and workflows. MCP connects Claude to external systems, APIs, databases, and services through a standardized protocol. The decision therefore depends on scope and integration boundaries. A reusable procedural workflow may belong in a Skill; access to an external enterprise system may warrant MCP; a narrowly application-specific operation can be a custom tool; and a built-in tool should generally be preferred when it already satisfies the requirement. A makes prior team experience the architectural criterion rather than requirements. B assumes newer technology is inherently better. C optimizes implementation convenience without considering maintainability, interoperability, or reuse. Therefore, D is the appropriate selection rule. Relevant Study Guide topics: built-in tools, custom tools, Skills, MCP, extension architecture, reuse boundaries, and capability selection."}, {"id": 11, "q": "You are designing a Claude application that will require structured JSON output for downstream processing. The output schema is well-defined, and downstream systems will reject malformed JSON.", "c": ["Define a clear schema, structure the prompt to request output in that schema, and validate Claude's output against the schema before passing it downstream.", "Structure the prompt to request output in a schema that is described in plain English, with downstream systems parsing whatever shape Claude produces.", "Avoid structured output and use free-form text everywhere instead, on the grounds that free-form text is more flexible and handles edge cases better than structured schemas.", "Define a clear schema and structure the prompt to request output in that schema, with downstream systems handling any validation needed."], "a": 0, "e": "Option C establishes the strongest application boundary between probabilistic model generation and deterministic downstream processing. When another component requires JSON with a known contract, the application should explicitly define the expected structure and ensure that model output conforms to it before downstream execution. Anthropic's current Structured Outputs guidance states that structured outputs constrain responses to a specific schema and are intended to provide valid, parseable data for downstream processing. The current Claude API supports JSON Schema through output_config.format, while SDK helpers can additionally parse and validate returned data. The underlying engineering principle remains the same even when structured-output enforcement is unavailable: never allow unvalidated model-generated structures to become trusted machine input. Option A provides insufficient contractual control. Option B defines the schema but pushes validation too late, increasing the probability that malformed or semantically invalid data reaches dependent components. Option D sacrifices machine reliability entirely. Therefore, C correctly combines schema specification, explicit format guidance, and validation. This corresponds to Claude Developer topics covering structured outputs, defensive application design, schema validation, and reliable model-to-system interfaces. The question and options are reproduced from the supplied examination set."}, {"id": 12, "q": "Your Claude application has been running for several conversation turns, and you notice the model occasionally references information that was discussed many turns ago but is no longer relevant. You suspect context drift is causing the model to weight stale content too heavily. How would you address the drift?", "c": ["Apply compaction to summarize older portions of the conversation so the gist remains while the specifics carry less weight.", "Reset the conversation after every turn so the model loses all prior turns when generating a response.", "Increase the context window size so all turns of the conversation remain visible to the model in full detail.", "Truncate the conversation so the model sees only the most recent turn during each subsequent response."], "a": 0, "e": "Option C applies the appropriate context-management technique. The issue is not simply whether the older conversation can physically fit into the context window; it is that stale details remain prominent enough to interfere with the model's current task. Effective context engineering optimizes signal quality, not merely maximum token retention. Anthropic's context-editing documentation describes compaction as summarizing accumulated history and replacing the full history with a structured summary when context becomes large. This preserves important task state while substantially reducing low-value detail that can distract later reasoning. A retains precisely the stale material producing the problem and therefore does not address context drift. B destroys all useful continuity between turns, including valid goals, decisions, and intermediate state. D is similarly excessive because limiting Claude to only the latest turn discards information that may still be required. Compaction provides the correct middle ground: retain durable conclusions, current objectives, unresolved issues, and other high-signal state while compressing obsolete conversational detail. Relevant Study Guide topics: context engineering, compaction, conversation history, long-running agents, stale context, context drift, and high-signal state preservation."}, {"id": 13, "q": "A Claude application that worked well in testing is now occasionally returning outputs that mention information not present in the input. The development team initially assumed the model was hallucinating, so they asked you to troubleshoot. What would you do first?", "c": ["Examine production traces to identify whether the issue is hallucination by the model, context loss, prompt injection, or another failure mode before recommending a fix.", "Replace the current model with a larger one to reduce the chance of hallucination, on the grounds that larger models tend to hallucinate less in typical applications.", "Add a system prompt instruction telling the model not to invent information, on the grounds that prompt-level instructions are the fastest fix for hallucination concerns.", "Apply a retrieval-augmented generation pattern to ground the responses in source content before any further investigation of the production traces."], "a": 0, "e": "Option A follows disciplined production debugging: diagnose the actual failure mode before changing architecture or prompts. An output containing unsupported information might indeed be hallucination, but similar symptoms can result from stale conversation state, incorrect retrieval, unexpected tool output, prompt injection, incorrect request construction, or mismatched model/configuration versions. A production trace should capture the user input, system instructions, relevant conversation history, retrieved content, tool calls and results, model/version, request parameters, response, and identifiers necessary to compare successful and failing cases. This establishes whether the model invented a fact or whether that fact entered context through another path. B changes the model before establishing causality. C may eventually be useful if the confirmed problem is insufficient grounding, but implementing RAG before diagnosis can hide rather than explain the defect. D similarly changes prompting before verifying that prompt behavior is responsible. The engineering sequence should be observe, reproduce, classify the failure, form a hypothesis, apply a targeted correction, and validate the correction with evaluations. Relevant Study Guide topics: production troubleshooting, observability, tracing, hallucination analysis, prompt injection, context failures, regression diagnosis, and lifecycle monitoring."}, {"id": 14, "q": "You are designing a Claude application that maintains user sessions across multi-turn conversations. The product team has asked how the application will handle session lifecycle: when sessions should expire, how state is reset, and how the application avoids carrying stale context into new conversations. How would you design session lifecycle?", "c": ["Define state reset triggers tied to specific application events but apply them across all sessions globally, with no per-session expiration rules.", "Define explicit session expiration rules, state reset triggers, and rules for starting fresh sessions so stale context does not leak into new conversations.", "Define a single short session timeout that applies across all conversations and treat the timeout as the application's complete session lifecycle mechanism.", "Define explicit session expiration rules but rely on users to start new conversations when they want fresh context, with no automatic reset triggers in the application."], "a": 1, "e": "A is the correct lifecycle architecture. The supplied Claude Certified Developer Foundations item explicitly selects A . A session is a state boundary, so its lifecycle must define when accumulated conversation state remains valid and when that state must be discarded. Anthropic's Managed Agents documentation establishes that a session maintains conversation history across multiple interactions and provides explicit session operations including creation, update, archive, and deletion. A therefore addresses all three required controls: expiration , reset , and fresh-session creation . Expiration prevents indefinitely retained conversational state. Reset triggers allow the application to clear state when events such as logout, workflow completion, tenant switching, or explicit user reset occur. Fresh-session rules prevent context belonging to an earlier task from influencing a logically unrelated conversation. B relies exclusively on timeout and does not cover event-driven resets. C places lifecycle correctness on users instead of the application. D applies global reset behavior and omits independent per-session expiration semantics."}, {"id": 15, "q": "The product team has asked you to choose a Claude model for a new feature. The team has provided functional requirements but has not specified performance, cost, or quality targets. The team's product manager says, \"Use whatever model gives us the best results.\" How would you respond?", "c": ["Ask the product team to specify quality, latency, and cost targets, then select the model whose tradeoffs best fit those targets.", "Choose the largest, highest-capability Claude model, on the grounds that \"best results\" is most likely to mean highest quality.", "Run every Claude model on a representative sample and pick whichever scores best on a generic benchmark.", "Choose a mid-tier model and ship the feature, because mid-tier models work for most use cases without specified targets."], "a": 0, "e": "Option A is correct because model selection requires measurable non-functional requirements, not an undefined objective such as \"best.\" Anthropic's model-selection guidance explicitly frames the decision around capabilities, speed, and cost and recommends identifying those requirements before narrowing the candidate models. \"Quality\" must also be translated into task-specific success criteria-for example classification accuracy, extraction correctness, acceptable false-positive rate, or human preference. Latency may be constrained by an interactive SLA, and cost may be defined per request, per user, or per completed task. Once those thresholds exist, representative evaluations can compare candidate models using the actual prompts and data. B uses a generic benchmark that may not correlate with the application's workload. C chooses a model tier without requirements or evidence. D optimizes only for raw capability and ignores latency and cost, potentially producing an unnecessarily expensive architecture. Thus, requirements definition precedes technology selection. Relevant Study Guide topics: Understanding Reqs, functional versus non-functional requirements, quality thresholds, latency budgets, cost constraints, acceptance criteria, workload-specific evaluation, and model-selection tradeoffs."}, {"id": 16, "q": "Your team's Claude application has been in production for a year, and the team has decided to formalize its testing strategy. Currently, the team writes ad-hoc tests for individual features but has no overall testing approach. What testing approach would you formalize?", "c": ["Adopt a test-driven development practice where unit tests are written before each feature is implemented and must pass before code is merged.", "Define a single testing approach that uses end-to-end tests and apply it consistently across all new features as they are added to the codebase.", "Continue writing ad-hoc tests as features ship and introduce a peer review step to ensure each test adequately covers the feature being released.", "Define unit tests for individual functions, integration tests for the Claude integration, and end-to-end tests for critical user flows, applied consistently across the codebase."], "a": 3, "e": "Option B establishes a layered testing strategy rather than relying on a single testing granularity. Unit tests validate deterministic functions and isolated components quickly. Integration tests verify boundaries between application code and Claude-related components such as API clients, tool execution, parsing, persistence, and error handling. End-to-end tests then validate the most important user workflows across the complete application stack. This separation is particularly useful for Claude applications because deterministic software failures and probabilistic model-quality failures should not be treated identically. Anthropic's evaluation guidance recommends defining specific, measurable success criteria and constructing representative test cases to determine whether model behavior meets those criteria. These evaluations complement conventional software tests rather than replacing them. A focuses exclusively on test-driven development; TDD can be valuable but does not define all required test levels. C preserves the existing ad-hoc methodology rather than establishing a repeatable quality strategy. D overuses expensive and slower end-to-end tests while omitting the faster diagnostic value of unit and integration tests. The supplied exam source marks B as correct. Relevant topics: SW Eng Foundations, test strategy, unit testing, integration testing, end-to-end testing, Claude evaluations, regression coverage, and production reliability."}, {"id": 17, "q": "You are choosing between using STDIO-based communication and HTTP-based communication for an MCP server. The server will be invoked by a Claude Code session running locally. Which communication pattern would you use?", "c": ["STDIO and HTTP simultaneously for redundancy, with the team running two communication patterns at the same time across Claude Code sessions.", "HTTP polling against the MCP server, treating HTTP as a substitute for the standard MCP communication patterns.", "HTTP on the grounds that HTTP is preferable to STDIO in any context the application might encounter during normal operation.", "STDIO because STDIO is well-suited to local process communication and avoids unnecessary network setup."], "a": 3, "e": "Option D is directly supported by both the supplied examination material and Claude Code's MCP documentation. The examination source selects STDIO for this local-process scenario. Claude Code's official MCP guidance distinguishes remote HTTP servers from local STDIO servers . Anthropic states that STDIO servers run as local processes and communicate through standard input and standard output. They are particularly suitable for local tools requiring direct machine access or for custom scripts. Claude Code can launch the process itself and communicate with it without creating, exposing, securing, or maintaining a network listener. HTTP is appropriate when the MCP server exists as a separately reachable network service, especially for cloud-hosted or shared services. That requirement is absent here: the server is being invoked locally from a Claude Code session. A creates duplicate transport infrastructure without a stated availability requirement. B incorrectly assumes one transport is universally superior regardless of deployment topology. C describes HTTP polling rather than the normal MCP transport relationship and introduces unnecessary request overhead. Therefore, local execution strongly favors STDIO; remote/shared deployment generally favors HTTP."}, {"id": 18, "q": "Your Claude application is deployed to development, staging, and production environments. Each environment uses a different model version, different prompt versions, and different plugin dependencies, but the configuration is currently scattered across environment variables, hardcoded values, and undocumented setup scripts. How would you manage the configuration?", "c": ["Move all configuration into hardcoded application code to reduce reliance on external configuration sources that are difficult to track over time.", "Use the latest available model version everywhere and stop pinning model versions, on the grounds that pinning adds maintenance overhead the team should aim to reduce.", "Standardize all environments to use the same configuration values to eliminate the differences between development, staging, and production.", "Consolidate the configuration into a version-controlled system documenting model version pinning, prompt versioning, and plugin dependencies for each environment."], "a": 3, "e": "Option C provides the required configuration-management discipline. Development, staging, and production may legitimately use different models, prompts, plugins, permissions, or service endpoints, but those differences must be explicit, reproducible, and auditable rather than scattered across undocumented mechanisms. Claude Code documentation follows the same configuration-as-code principle. Project-level configuration can live in source-controlled files such as .claude/settings.json, while project instructions are maintained in repository-level CLAUDE.md. Anthropic specifically distinguishes shared project settings from local developer configuration. A introduces uncontrolled model changes and regression risk. B hides configuration in application logic and makes environment differences harder to review. D ignores the fact that environments often require deliberate differences-for example, production credentials or pinned release versions. The correct strategy is therefore to define configuration centrally, pin compatibility-sensitive dependencies, record environment-specific overrides, review modifications through source control, and retain rollback history. Relevant Study Guide topics: configuration management, environment isolation, model versioning, prompt versioning, dependency management, reproducibility, and controlled deployment."}, {"id": 19, "q": "Your Claude agent has access to a tool that retrieves customer records. A teammate has noticed that the agent occasionally calls the tool with arguments the schema does not declare, and the tool's downstream service returns an error each time. The teammate proposes loosening the schema so the tool accepts whatever arguments the model produces. How would you respond?", "c": ["Add a system prompt instruction telling the model to produce schema-conforming arguments, treating the prompt instruction as the primary mechanism for keeping the agent's tool calls valid.", "Remove the schema entirely and rely on the downstream service to reject invalid calls, treating the downstream service as the team's primary enforcement layer.", "Keep the schema strict, validate arguments before dispatching, and return a structured error so the agent can retry.", "Loosen the schema as the teammate proposed so the downstream service receives every call the agent makes during normal operation."], "a": 2, "e": "The supplied question identifies B as the intended answer. Tool schemas are contracts between Claude and executable application code. When the downstream service accepts only a defined set of arguments, relaxing that schema merely shifts invalid data farther into the system and increases runtime failures. Anthropic's current tooling provides an even stronger implementation of this principle through strict tool use . Setting strict: true constrains tool inputs to the declared JSON Schema, preventing undeclared properties, missing required values, and incompatible parameter types where the supported schema subset is used. Anthropic explicitly recommends strict tool use for validated parameters, type-safe function calls, and reliable agentic workflows. In a non-strict or legacy implementation, the application should still validate arguments before dispatch and convert invalid calls into structured tool errors that Claude can interpret and potentially correct. A prompt instruction can reinforce behavior, but it should not replace deterministic validation. C and D weaken the system boundary and knowingly send invalid calls downstream. Therefore, maintain the contract rather than adapting the contract to malformed model output."}, {"id": 20, "q": "Your team is integrating Claude into an existing REST API service. The service handles concurrent requests, and you are deciding how to structure the Claude API calls within the existing async codebase. How would you structure the Claude calls?", "c": ["Replace the existing async REST service with a synchronous service to match the call style of synchronous Claude SDK clients.", "Run Claude API calls in a separate thread pool isolated from the rest of the service so the main event loop is not affected.", "Make synchronous Claude API calls and block the async event loop until each call completes before processing the next request.", "Use the Claude SDK's async client and structure Claude calls as awaitable operations alongside the rest of the service's async code."], "a": 3, "e": "Option C is the natural integration model for an application that already uses asynchronous I/O. Claude API calls are network-bound operations, so blocking the application's event loop while waiting for responses would reduce concurrency and impair throughput. The Anthropic Python SDK explicitly provides AsyncAnthropic, and its documented usage awaits client.messages.create() directly. It also supports an aiohttp backend when improved asynchronous concurrency is desired. This means Claude requests can participate in the same cooperative asynchronous execution model as other database, HTTP, or service calls. While one request waits for remote I/O, the runtime can continue serving other work rather than dedicating the event loop to an idle blocking operation. A can be used when integrating unavoidable blocking libraries into async software, but it adds thread-pool management when an official asynchronous client already exists. B needlessly redesigns a concurrent REST service around a synchronous integration. D is specifically harmful because blocking the event loop prevents normal concurrent request processing. Therefore, C uses the abstraction provided for exactly this architecture. Relevant Study Guide topics: Claude SDK clients, asynchronous APIs, awaitable I/O, concurrency, RESTservice integration, and scalable application architecture."}, {"id": 21, "q": "You are writing a system prompt for a Claude application that needs to produce output in a specific JSON shape. The downstream system will reject any output that does not match the schema. Your prompt would need to…", "c": ["Instruct Claude to use whichever output format it considers most appropriate for each request the application handles.", "Omit any reference to the format and rely on a post-processing step in the application to reshape Claude's output.", "Instruct Claude to return JSON sometimes and free text other times so the application's output captures both formats.", "Include explicit constraints describing the required JSON schema and an instruction to produce only output matching that schema."], "a": 3, "e": "The supplied question selects D . If a downstream component requires an exact machinereadable structure, the expected structure must be communicated explicitly rather than left to Claude's discretion. The prompt should define required fields, types, nesting, permissible values where relevant, and instruct Claude not to emit surrounding prose. Anthropic's consistency guidance states that developers should precisely specify the desired output format when format consistency matters. More importantly, current Claude APIs provide Structured Outputs for cases requiring guaranteed JSON Schema conformance; Anthropic explicitly recommends Structured Outputs instead of prompt-only techniques when valid schema-compliant JSON is mandatory. Therefore, D is the strongest prompt choice among the listed alternatives. In a contemporary production implementation, the design can be strengthened further by supplying the schema through Claude's structured- output configuration and performing downstream semantic validation where business rules exceed JSON Schema. A permits arbitrary formatting. B intentionally creates inconsistent representations. C assumes post- processing can reliably reconstruct missing or ambiguously formatted information, which is significantly less robust than specifying the contract up front."}, {"id": 22, "q": "The team is debating whether to integrate with the Claude API directly or through a thirdparty abstraction layer that supports multiple LLM providers. The team has identified that all current and projected use cases run on Claude, no internal customer has requested LLM portability, and the team's product roadmap does not mention multi-provider support over the next two years. The third-party abstraction would add roughly 15 percent overhead in code complexity and introduce one additional dependency. Which integration approach would you recommend?", "c": ["The third-party abstraction layer, on the grounds that multi-provider support is valuable for any application as a matter of long-term flexibility across vendors.", "Both integration paths in parallel, where the application uses each path on different runs to compare which performs better in production over time.", "Direct integration with Claude through its SDK, because no multi-provider need exists and abstraction would add complexity that does not pay off.", "A custom multi-provider abstraction layer the team builds in-house so that the team controls every part of the abstraction the application uses for its API calls."], "a": 2, "e": "D follows the principle of choosing the simplest architecture that satisfies demonstrated requirements . The supplied examination item explicitly marks D. In this scenario, portability is neither a present functional requirement nor a foreseeable roadmap requirement. Adding an abstraction therefore creates measurable complexity without delivering an identified product capability. Anthropic provides official general-purpose SDKs for Claude in multiple languages. These expose the Messages API directly while adding idiomatic interfaces, type safety, streaming support, retries, and error handling. Anthropic separately describes compatibility layers and framework-specific libraries as alternative integration surfaces rather than requirements for ordinary Claude development. A third-party abstraction becomes rational when there is a genuine requirement for multiple providers, vendor switching, standardized cross-model interfaces, or an existing architectural platform that mandates it. None exists here. Building that flexibility speculatively increases dependencies, debugging surface, version- compatibility work, and the possibility that provider-specific Claude capabilities are hidden behind a lowest- common-denominator API. A optimizes for hypothetical future requirements. B doubles operational complexity. C creates an even larger maintenance burden."}, {"id": 23, "q": "Your team's Claude agent has accumulated several customizations that bypass the SDK's defaults, including custom history management, retry logic, and error handling. A new team member has proposed reverting all the customizations to maintain the codebase more easily. The tech lead disagrees and says each customization was added for a reason. How would you advise the team?", "c": ["Revert all customizations to the SDK's defaults to standardize the codebase.", "Decide on each customization individually based on its original reason and the SDK's current capabilities.", "Migrate the agent off the SDK and rebuild it with a custom loop.", "Keep all customizations, trusting that the tech lead's original reasoning is still valid."], "a": 1, "e": "The correct approach is to evaluate each customization independently against both its original requirement and the capabilities currently supplied by the Claude SDK. Custom code has an ongoing maintenance cost, but automatically removing it is unsafe because some modifications may encode genuine application requirements that the standard SDK behavior still does not address. Conversely, automatically retaining every customization can preserve obsolete complexity after the SDK has evolved. This is particularly relevant because Anthropic's SDKs already provide capabilities that developers might otherwise implement themselves. Official Claude API documentation states that SDKs provide built-in request formatting, error handling, retries, timeouts, and other integration functionality. For example, transient connection, rate-limit, and server errors are retried automatically with exponential backoff. Therefore, each custom history, retry, or error-management layer should be reviewed for its actual purpose. If an SDK primitive now provides equivalent behavior, removing duplicate code improves maintainability. If the customization still satisfies a distinct requirement, it should remain. The supplied exam source explicitly identifies D as the intended answer. Relevant topics: Agent Construction, SDK capabilities, abstraction boundaries, technical-debt management, retries, error handling, and agent state management."}, {"id": 24, "q": "Your Claude application's content policy specifies categories of content it should not produce under any circumstance. The application currently has no mechanism to enforce this policy, and content matching these categories is appearing in the application's output. How would you enforce the content policy?", "c": ["Add deterministic output filtering that checks responses against the content policy before they reach users.", "Enhance the system prompt to contain explicit instructions for the categories to avoid, complete with examples of each category. Treat the strengthened prompt as the primary enforcement mechanism for the application's content policy across all responses.", "Remove the content policy entirely and let any output reach users during normal operation, accepting whatever content the application produces in response to incoming traffic.", "Move enforcement to users by asking them to report content policy violations after the violating content has already reached them in the application's responses."], "a": 0, "e": "Option D is the strongest enforcement design because an unconditional content policy requires an application- level control between model generation and user delivery. Prompt instructions are valuable for steering Claude, but they are probabilistic controls and should not be treated as the sole enforcement mechanism when prohibited categories must never be exposed. Anthropic's guardrail guidance recommends layered safeguards including screening, validation, monitoring, and filtering rather than relying exclusively on prompts. Its prompt-leak guidance specifically recommends output screening and post-processing, including deterministic techniques such as keyword matching, regular expressions, or other textprocessing mechanisms where appropriate. A improves the probability of policy compliance but cannot guarantee that every generated response will satisfy an externally defined application policy. B explicitly abandons the requirement. C detects violations only after exposure, which is unsuitable when the content must not reach users. A production architecture can combine system instructions, structured classification, policy engines, deterministic rules, and model-based moderation, but the decisive requirement is enforcement before output delivery. Relevant Claude Developer topics are guardrails, output filtering, content moderation, deterministic enforcement, defense in depth, safe application boundaries, and production Claude application design."}, {"id": 25, "q": "Your team uses Claude Code across multiple repositories. You want the team's rules and general coding standards to apply to all repositories, and other rules to apply only to specific repositories. The team is currently duplicating instructions across every repository's CLAUDE.md file. How would you address this?", "c": ["Move all instructions to a separate documentation site that developers consult during Claude Code sessions across all repositories.", "Use a single repository's CLAUDE.md as the central source of truth and link to it from every other repository's CLAUDE.md file.", "Use a CLAUDE.md hierarchy that scopes general standards broadly and project-specific context within each repository's local CLAUDE.md.", "Stop using CLAUDE.md altogether and ask each developer to configure Claude Code manually for each project they work on."], "a": 2, "e": "B is directly supported by both the supplied examination source and Claude Code's configuration model. The source marks the hierarchical CLAUDE.md approach as correct. Claude Code supports instructions at multiple scopes, allowing broadly applicable standards to be separated from project-specific context rather than duplicated across every repository. Anthropic documents several CLAUDE.md scopes. Organization-managed instructions can apply broadly; user-level instructions in ~/.claude/CLAUDE.md apply across a user's projects; project instructions in . /CLAUDE.md or ./.claude/CLAUDE.md provide repository-specific architecture, conventions, commands, and workflows. Claude Code loads applicable files according to the directory hierarchy, allowing broad instructions and more specific local instructions to coexist. This arrangement improves maintainability because common coding standards are defined once at the appropriate scope, while each repository retains only the context unique to that project. A documentation website does not automatically inject rules into Claude Code context. C creates inconsistent manual configuration. D improperly couples unrelated repositories to one repository's configuration."}, {"id": 26, "q": "The Claude application your team built has grown over six months, and the prompt-handling code has accumulated duplication and tangled control flow. The functionality is working, but new features are getting harder to add. How would you address this?", "c": ["Continue adding features and plan a refactoring pass after the next two release cycles when the team has more bandwidth for internal work.", "Refactor the prompt-handling code in small increments as part of each new feature ticket, treating the cleanup as a side effect of feature work.", "Plan a refactoring pass to consolidate duplicated logic, separate concerns, and simplify control flow before adding new features.", "Move all the prompt-handling code into a single large function to reduce the number of files developers have to navigate when reading the code."], "a": 2, "e": "The supplied Claude Developer item selects A . The symptoms-duplicated logic, tangled control flow, and increasing difficulty adding features-indicate accumulated technical debt in a component that has become structurally difficult to change. Because the problem is already materially reducing development velocity, deliberate refactoring should occur before additional feature pressure compounds it. The objective is behavioral preservation with structural improvement. Duplicated prompt construction should be consolidated where the behavior is genuinely shared. Prompt preparation, configuration, API invocation, validation, error handling, and post-processing should have clear responsibilities. Control flow should be simplified so each stage is testable independently. Existing tests should first capture important current behavior so refactoring can proceed without silently changing application semantics. B can be appropriate for minor cleanup, but the question describes broad systemic complexity. Mixing substantial structural refactoring into unrelated feature tickets makes scope, review, and regression analysis harder. C knowingly allows the debt to compound. D centralizes complexity rather than removing it and violates separation of concerns."}, {"id": 27, "q": "Your Claude application runs long agentic workflows where the agent makes many tool calls, and the conversation history grows quickly. After about 20 tool calls, you notice the agent's responses become less focused and sometimes ignore earlier task constraints. How would you address this?", "c": ["Remove tool calling from the workflow entirely so the agent operates as a single textgeneration step with no tool outputs accumulating in the context window.", "Increase the model's context window so the agent can hold every tool output at full detail across the entire workflow no matter how many tool calls it accumulates.", "Apply context engineering techniques such as tool output pruning or compaction to keep the active task state visible while reducing the volume of older content.", "Restart the agent every five tool calls to prevent any drift, with the agent losing all task state at each restart point during the workflow."], "a": 2, "e": "Option B addresses the actual architectural failure: low-value historical material is crowding out the high- signal information required for current reasoning. A larger context window does not guarantee better attention to important constraints. Effective agent architecture actively manages what remains in context as the workflow progresses. Anthropic's Context Editing documentation explicitly provides tool-result clearing for agentic workflows with heavy tool usage. Once Claude has processed an older result, verbose file contents, search output, or API responses may no longer need to remain in full. Older results can therefore be removed while recent and important state remains available. Anthropic also documents compaction, where accumulated history is summarized and replaced with a smaller representation that preserves important task state. A removes an important agent capability rather than solving context growth. C retains all accumulated noise and merely gives it more space. D repeatedly destroys valuable task state and creates artificial workflow boundaries. Therefore, B preserves goals, decisions, unresolved constraints, and necessary results while reducing irrelevant historical content. Relevant Study Guide topics: context engineering, toolresult clearing, compaction, long-running agents, context quality, and task-state preservation."}, {"id": 28, "q": "You are setting up the configuration management approach for a new Claude Code project. Your team will use CLAUDE.md files and settings.json files to control behavior, and you want to make sure changes are tracked and reviewable. The configuration management approach would...", "c": ["Duplicate CLAUDE.md and settings.json files in multiple repositories to provide redundancy, on the grounds that a single source of truth is risky for project configuration.", "Version-control CLAUDE.md alongside the project's source code and settings.json files in a separate repository from the project's source code.", "Version-control CLAUDE.md and settings.json files in a separate repository from the project's source code, so configuration evolves independently from the application code over time.", "Version-control CLAUDE.md and settings.json files alongside the project's source code, with changes reviewed through standard pull request workflows the team applies."], "a": 3, "e": "D applies configuration as code and is the answer explicitly selected in the supplied examination source. Claude Code treats project configuration as part of the repository's working context. Anthropic documents project-level CLAUDE.md as the mechanism for providing project instructions and context, while shared project configuration belongs in .claude/settings.json. Crucially, Anthropic states that .claude/settings.json is intended to be checked into source control and shared with the team . Keeping these files alongside the code establishes a single versioned relationship between application behavior and the configuration that influences Claude Code. Standard pull requests then provide diffs, peer review, ownership controls, CI validation, audit history, and straightforward rollback. A particular commit can therefore reproduce both source code and its associated Claude project configuration. A creates competing copies and synchronization risk. B artificially separates behavior configuration from the code version it affects. C creates the same problem specifically for settings.json. Developer-local values remain distinct: .claude/settings.local.json exists specifically for settings that should not be committed."}, {"id": 29, "q": "You maintain a Claude application that uses Claude Sonnet 4.5 across several production workflows. Anthropic released Claude Sonnet 4.7, which your evaluation suite shows performing 8% better on your highest-volume task. However, this version produces different output formatting on two of your structured- extraction prompts that downstream consumers parse with regex-based code. To roll out the upgrade, you would...", "c": ["Rewrite the downstream parsing code to accept a wider range of output formats to ensure the application is resilient to future model upgrades without requiring prompt changes.", "Switch the model identifier in the application's configuration to the new model, then monitor production for parsing failures to be fixed as failures surface.", "Adjust the prompts to constrain output format, re-run evaluations against the expected parsing-layer schema, then roll the model out with a feature flag and the option to revert per workflow.", "Keep the older model in production to preserve the fragile parsing layer that may risk breaking with any model change."], "a": 2, "e": "Option A is correct because a model upgrade should be treated as a controlled application change, not a simple identifier substitution. Anthropic's evaluation guidance recommends defining measurable success criteria and running task-specific evaluations that mirror real production behavior, including edge cases. Its model-migration guidance likewise recommends testing replacement models before moving production workloads. Here, the new model improves the highest-volume task but changes output formatting on structured-extraction prompts. That means the migration has both a quality benefit and a compatibility risk. The correct response is to tighten the output contract, re-run evaluations against the parsing/schema boundary, then deploy progressively with a feature flag and a per-workflow rollback path. This limits blast radius and preserves a known-good recovery option. Option B pushes an unverified behavior change directly into production. Option C makes downstream parsing permissive, which can conceal schema drift instead of enforcing a stable contract. Option D permanently preserves a fragile implementation and discards the measured quality improvement. Taking the model version stated in the question as the scenario, A is the correct lifecycle strategy. Relevant Study Guide topics: model migration, regression evaluation, structured output, compatibility testing, progressive rollout, rollback, and production change management."}, {"id": 30, "q": "You are building a Claude application that needs to deliver model output to end users as it is generated, instead of waiting for the full response to complete. The Claude API mechanism you would use is…", "c": ["Structured JSON output, which delivers responses only after the model has finalized the JSON shape across the entire response.", "Prompt caching, which speeds up the cost profile of future requests and does not affect the delivery timing of the first response.", "Streaming responses, which deliver tokens incrementally as the model generates them so users see output progressively.", "The Batch API, which delivers full responses after a delay suitable for non-interactive workloads."], "a": 2, "e": "Option B is the intended and technically correct answer. The supplied Claude Developer exam source selects streaming responses. Streaming allows the client application to begin receiving output before generation of the complete message has finished, reducing perceived latency for interactive user experiences. Anthropic's official Messages API documentation states that setting stream: true causes responses to be delivered incrementally through Server-Sent Events (SSE) . Claude can stream text deltas as well as other event types, including structured tool-use and extendedthinking events where applicable. Anthropic's SDKs provide corresponding synchronous or asynchronous streaming helpers. The application consumes events as they arrive, updates the UI progressively, and then handles the final event or stop reason when generation completes. This architecture is particularly useful for chat interfaces and other latency-sensitive interactive experiences. A addresses output structure, not progressive transmission. C is designed for asynchronous, throughput- oriented processing rather than immediate user interaction. D reduces processing cost and latency for repeated prompt prefixes but does not itself turn a response into an incremental stream."}, {"id": 31, "q": "Your team is preparing a new Claude application for production, and the product team has asked for a cost projection. The team needs to estimate the cost based on expected request volume, average input length, and average output length. How would you build the projection?", "c": ["Build a cost model that combines expected request volume, average input tokens, average output tokens, the chosen model's pricing, and any caching benefits.", "Build a cost model that uses the average per-request cost from a similar Claude application the team built last year, scaling that figure by expected request volume.", "Build a cost model based on expected request volume and the chosen model's pricing, treating average input and output token counts as variables to be estimated post-launch.", "Build a cost model that combines expected request volume and average input tokens, treating output tokens as a small enough share of cost to leave out of the projection."], "a": 0, "e": "Option B is correct because Claude API cost is fundamentally driven by usage volume multiplied by the token economics of the selected model and features. A credible projection must therefore estimate requests, average input tokens per request, average output tokens per request, applicable input/output prices, and expected prompt-cache behavior. Anthropic's pricing documentation treats input, output, cache writes, and cache reads as distinct billable categories, with cache hits priced below standard input processing. A practical forecast can be modeled as: request volume × expected per-request input cost plus request volume × expected per-request output cost, adjusted for cache-write/read rates and any other applicable pricing modifiers. The model should also include ranges for variance rather than only one point estimate, because token lengths and cache-hit rates will fluctuate in production. Option A assumes a historical application has the same token profile and pricing, which may be false. Option C omits output tokens even though output pricing can be a
